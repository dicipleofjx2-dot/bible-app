<text x="141.1" y="156.0" font-size="16" fill="#9A6510" font-weight="700" text-anchor="middle">1</text>
<line x1="225.2" y1="196.0" x2="236.2" y2="196.0" stroke="#6B5C52" stroke-width="2.5"/>
<path d="M245.2,196.0 L234.2,190.0 L234.2,202.0 Z" fill="#6B5C52"/>
<rect x="60.0" y="258.0" width="162.2" height="230.0" rx="12" fill="#F2F0EE" stroke="none" stroke-width="0"/>
<text x="72.0" y="292.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">하늘의 빛</text>
<text x="72.0" y="312.1" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「사울아 사울아」</text>
<text x="72.0" y="332.3" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">아나니아의 안수</text>
<text x="72.0" y="352.4" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「택한 나의 그릇」</text>
<text x="72.0" y="410.0" font-size="12" fill="#9A6510" font-weight="700" text-anchor="start">행 9:1–19</text>
<rect x="72.0" y="430.0" width="138.2" height="32.0" rx="16" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="141.1" y="451.0" font-size="13" fill="#6B5C52" font-weight="700" text-anchor="middle">AD 33–35 무렵</text>
<rect x="248.2" y="150.0" width="162.2" height="92.0" rx="12" fill="#9A6510" stroke="none" stroke-width="0"/>
<text x="329.4" y="186.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">다메섹</text>
<text x="329.4" y="214.0" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="middle">첫 전도</text>
