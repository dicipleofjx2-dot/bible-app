<text x="329.4" y="156.0" font-size="16" fill="#9A6510" font-weight="700" text-anchor="middle">2</text>
<line x1="413.5" y1="196.0" x2="424.5" y2="196.0" stroke="#6B5C52" stroke-width="2.5"/>
<path d="M433.5,196.0 L422.5,190.0 L422.5,202.0 Z" fill="#6B5C52"/>
<rect x="248.2" y="258.0" width="162.2" height="230.0" rx="12" fill="#F2F0EE" stroke="none" stroke-width="0"/>
<text x="260.2" y="292.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「즉시로 각 회당에서</text>
<text x="260.2" y="312.1" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">예수의 하나님의</text>
<text x="260.2" y="332.3" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">아들이심을</text>
<text x="260.2" y="352.4" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">전파하니」</text>
<text x="260.2" y="410.0" font-size="12" fill="#9A6510" font-weight="700" text-anchor="start">행 9:20–22</text>
<rect x="436.5" y="150.0" width="162.2" height="92.0" rx="12" fill="#8C7B6E" stroke="none" stroke-width="0"/>
<text x="517.6" y="186.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">아라비아</text>
<text x="517.6" y="214.0" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="middle">물러남</text>
<circle cx="517.6" cy="150" r="17" fill="#FFFFFF" stroke="#8C7B6E" stroke-width="3"/>
<text x="517.6" y="156.0" font-size="16" fill="#8C7B6E" font-weight="700" text-anchor="middle">3</text>
<line x1="601.8" y1="196.0" x2="612.8" y2="196.0" stroke="#6B5C52" stroke-width="2.5"/>
<path d="M621.8,196.0 L610.8,190.0 L610.8,202.0 Z" fill="#6B5C52"/>
<rect x="436.5" y="258.0" width="162.2" height="230.0" rx="12" fill="#F2F0EE" stroke="none" stroke-width="0"/>
<text x="448.5" y="292.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">사도행전에는 없다</text>
<text x="448.5" y="312.1" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">바울이 직접 말한다</text>
<text x="448.5" y="332.3" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「아라비아로</text>
<text x="448.5" y="352.4" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">갔다가」</text>
<text x="448.5" y="410.0" font-size="12" fill="#8C7B6E" font-weight="700" text-anchor="start">갈 1:17</text>
<rect x="624.8" y="150.0" width="162.2" height="92.0" rx="12" fill="#9A6510" stroke="none" stroke-width="0"/>
<text x="705.9" y="186.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">다메섹</text>
<text x="705.9" y="214.0" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="middle">광주리 탈출</text>
<circle cx="705.9" cy="150" r="17" fill="#FFFFFF" stroke="#9A6510" stroke-width="3"/>
<text x="705.9" y="156.0" font-size="16" fill="#9A6510" font-weight="700" text-anchor="middle">4</text>
<line x1="790.0" y1="196.0" x2="801.0" y2="196.0" stroke="#6B5C52" stroke-width="2.5"/>
<path d="M810.0,196.0 L799.0,190.0 L799.0,202.0 Z" fill="#6B5C52"/>
<rect x="624.8" y="258.0" width="162.2" height="230.0" rx="12" fill="#F2F0EE" stroke="none" stroke-width="0"/>
<text x="636.8" y="292.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">유대인들이</text>
<text x="636.8" y="312.1" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">죽이려 하여</text>
<text x="636.8" y="332.3" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">밤에 광주리를 타고</text>
<text x="636.8" y="352.4" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">성벽을 내려가다</text>
<text x="636.8" y="410.0" font-size="12" fill="#9A6510" font-weight="700" text-anchor="start">행 9:23–25</text>
<rect x="636.8" y="430.0" width="138.2" height="32.0" rx="16" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="705.9" y="451.0" font-size="13" fill="#6B5C52" font-weight="700" text-anchor="middle">고후 11:32–33</text>
<rect x="813.0" y="150.0" width="162.2" height="92.0" rx="12" fill="#B5532F" stroke="none" stroke-width="0"/>
<text x="894.1" y="186.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">예루살렘</text>
<text x="894.1" y="214.0" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="middle">바나바의 소개</text>
<circle cx="894.1" cy="150" r="17" fill="#FFFFFF" stroke="#B5532F" stroke-width="3"/>
<text x="894.1" y="156.0" font-size="16" fill="#B5532F" font-weight="700" text-anchor="middle">5</text>
<line x1="978.2" y1="196.0" x2="989.2" y2="196.0" stroke="#6B5C52" stroke-width="2.5"/>
<path d="M998.2,196.0 L987.2,190.0 L987.2,202.0 Z" fill="#6B5C52"/>
<rect x="813.0" y="258.0" width="162.2" height="230.0" rx="12" fill="#F2F0EE" stroke="none" stroke-width="0"/>
<text x="825.0" y="292.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">제자들이</text>
<text x="825.0" y="312.1" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">다 두려워함</text>
<text x="825.0" y="332.3" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">바나바가 사도들에게</text>
<text x="825.0" y="352.4" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">데려감 · 게바와 15일</text>
<text x="825.0" y="410.0" font-size="12" fill="#B5532F" font-weight="700" text-anchor="start">행 9:26–29 · 갈 1:18</text>
<rect x="825.0" y="430.0" width="138.2" height="32.0" rx="16" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="894.1" y="451.0" font-size="13" fill="#6B5C52" font-weight="700" text-anchor="middle">회심 3년 뒤</text>
<rect x="1001.2" y="150.0" width="162.2" height="92.0" rx="12" fill="#5B6B7F" stroke="none" stroke-width="0"/>
<text x="1082.4" y="186.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">다소</text>
<text x="1082.4" y="214.0" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="middle">숨은 세월</text>
<circle cx="1082.4" cy="150" r="17" fill="#FFFFFF" stroke="#5B6B7F" stroke-width="3"/>
<text x="1082.4" y="156.0" font-size="16" fill="#5B6B7F" font-weight="700" text-anchor="middle">6</text>
<line x1="1166.5" y1="196.0" x2="1177.5" y2="196.0" stroke="#6B5C52" stroke-width="2.5"/>
<path d="M1186.5,196.0 L1175.5,190.0 L1175.5,202.0 Z" fill="#6B5C52"/>
<rect x="1001.2" y="258.0" width="162.2" height="230.0" rx="12" fill="#F2F0EE" stroke="none" stroke-width="0"/>
<text x="1013.2" y="292.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">헬라파 유대인이</text>
<text x="1013.2" y="312.1" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">죽이려 하자</text>
<text x="1013.2" y="332.3" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">형제들이 고향</text>
<text x="1013.2" y="352.4" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">다소로 보냄</text>
<text x="1013.2" y="410.0" font-size="12" fill="#5B6B7F" font-weight="700" text-anchor="start">행 9:30 · 갈 1:21</text>
<rect x="1013.2" y="430.0" width="138.2" height="32.0" rx="16" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="1082.4" y="451.0" font-size="13" fill="#6B5C52" font-weight="700" text-anchor="middle">약 10년 가까이</text>
<rect x="1189.5" y="150.0" width="162.2" height="92.0" rx="12" fill="#2F7466" stroke="none" stroke-width="0"/>
<text x="1270.6" y="186.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">안디옥</text>
<text x="1270.6" y="214.0" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="middle">바나바가 찾아옴</text>
<circle cx="1270.6" cy="150" r="17" fill="#FFFFFF" stroke="#2F7466" stroke-width="3"/>
<text x="1270.6" y="156.0" font-size="16" fill="#2F7466" font-weight="700" text-anchor="middle">7</text>
<line x1="1354.8" y1="196.0" x2="1365.8" y2="196.0" stroke="#6B5C52" stroke-width="2.5"/>
<path d="M1374.8,196.0 L1363.8,190.0 L1363.8,202.0 Z" fill="#6B5C52"/>
<rect x="1189.5" y="258.0" width="162.2" height="230.0" rx="12" fill="#F2F0EE" stroke="none" stroke-width="0"/>
<text x="1201.5" y="292.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「사울을 찾으러</text>
<text x="1201.5" y="312.1" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">다소에 가서」</text>
<text x="1201.5" y="332.3" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">1년 동안 가르침</text>
<text x="1201.5" y="352.4" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">흉년 구제금 전달</text>
<text x="1201.5" y="410.0" font-size="12" fill="#2F7466" font-weight="700" text-anchor="start">행 11:25–30</text>
<rect x="1201.5" y="430.0" width="138.2" height="32.0" rx="16" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="1270.6" y="451.0" font-size="13" fill="#6B5C52" font-weight="700" text-anchor="middle">AD 44–45 무렵</text>
<rect x="1377.8" y="150.0" width="162.2" height="92.0" rx="12" fill="#2F7466" stroke="none" stroke-width="0"/>
<text x="1458.9" y="186.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">안디옥</text>
<text x="1458.9" y="214.0" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="middle">파송</text>
<circle cx="1458.9" cy="150" r="17" fill="#FFFFFF" stroke="#2F7466" stroke-width="3"/>
<text x="1458.9" y="156.0" font-size="16" fill="#2F7466" font-weight="700" text-anchor="middle">8</text>
<rect x="1377.8" y="258.0" width="162.2" height="230.0" rx="12" fill="#F2F0EE" stroke="none" stroke-width="0"/>
<text x="1389.8" y="292.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">선지자 · 교사</text>
<text x="1389.8" y="312.1" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">명단에 「및 사울」</text>
<text x="1389.8" y="332.3" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">(13:1)</text>
<text x="1389.8" y="352.4" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">금식하고 안수하여</text>
<text x="1389.8" y="410.0" font-size="12" fill="#2F7466" font-weight="700" text-anchor="start">행 13:1–3</text>
<rect x="1389.8" y="430.0" width="138.2" height="32.0" rx="16" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="1458.9" y="451.0" font-size="13" fill="#6B5C52" font-weight="700" text-anchor="middle">AD 46–47 무렵</text>
<rect x="60.0" y="520.0" width="1480.0" height="150.0" rx="14" fill="#F3E7D2" stroke="none" stroke-width="0"/>
<text x="90.0" y="562.0" font-size="22" fill="#9A6510" font-weight="700" text-anchor="start">두 번 길을 열어 준 사람 — 바나바</text>
<text x="90.0" y="600.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">① 예루살렘에서 모두 사울을 두려워할 때 「바나바가 데리고 사도들에게 가서」 그의 회심을 증언했다(행 9:27).</text>
<text x="90.0" y="627.2" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">② 다소에 묻혀 있던 사울을 「찾으러 다소에 가서」 안디옥 교회로 데려왔다(행 11:25–26). 그렇게 이방 선교의 사도가 준비되었다.</text>
<rect x="60.0" y="692.0" width="1480.0" height="130.0" rx="14" fill="#D9EAE6" stroke="none" stroke-width="0"/>
<text x="90.0" y="734.0" font-size="22" fill="#2F7466" font-weight="700" text-anchor="start">왜 안디옥인가</text>
<text x="90.0" y="772.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">스데반의 일로 흩어진 이들이 안디옥에 이르러 헬라인에게도 전했고(행 11:19–21), 제자들이 거기서 처음 「그리스도인」이라 불렸다(11:26).</text>
<text x="90.0" y="799.2" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">예루살렘이 아니라 유대인과 이방인이 함께 모인 이 교회가, 땅 끝을 향한 첫 선교사를 보냈다.</text>
</svg>