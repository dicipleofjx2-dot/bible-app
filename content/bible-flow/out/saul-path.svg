<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="60.0" y="68.0" font-size="34" fill="#2A211B" font-weight="700" text-anchor="start">회심에서 파송까지 — 사울의 길</text>
<text x="60.0" y="104.0" font-size="17" fill="#6B5C52" font-weight="400" text-anchor="start">사도행전 9–13장 · 갈라디아서 1장 · 연대는 모두 「약」</text>
<rect x="60.0" y="150.0" width="162.2" height="92.0" rx="12" fill="#9A6510" stroke="none" stroke-width="0"/>
<text x="141.1" y="186.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">다메섹 길</text>
<text x="141.1" y="214.0" font-size="15" fill="#FFFFFF" font-weight="400" text-anchor="middle">회심</text>
