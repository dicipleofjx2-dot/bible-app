<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60.0" y="60.0" font-size="32" fill="#2A211B" font-weight="700" text-anchor="start">일곱 교회의 환상과 편지 — 요한계시록 1–3장</text>
<text x="60.0" y="92.0" font-size="16" fill="#6B5C52" font-weight="400" text-anchor="start">「네 본 것은 … 일곱 별은 일곱 교회의 사자요 일곱 촛대는 일곱 교회니라」(1:20)</text>
<rect x="60.0" y="112.0" width="640.0" height="300.0" rx="16" fill="#1F2433" stroke="none"/>
<rect x="126.0" y="256.0" width="8" height="40" fill="#B8860B"/>
<rect x="116.0" y="294.0" width="28" height="6" rx="3" fill="#B8860B"/>
<ellipse cx="130.0" cy="247.0" rx="6" ry="11" fill="#F6C453"/>
<text x="130.0" y="318.0" font-size="12.5" fill="#F2E6C9" font-weight="700" text-anchor="middle">에베소</text>
<rect x="209.33333333333331" y="286.0" width="8" height="40" fill="#B8860B"/>
<rect x="199.33333333333331" y="324.0" width="28" height="6" rx="3" fill="#B8860B"/>
<ellipse cx="213.33333333333331" cy="277.0" rx="6" ry="11" fill="#F6C453"/>
<text x="213.3" y="348.0" font-size="12.5" fill="#F2E6C9" font-weight="700" text-anchor="middle">서머나</text>
<rect x="292.66666666666663" y="307.9615242270663" width="8" height="40" fill="#B8860B"/>
<rect x="282.66666666666663" y="345.9615242270663" width="28" height="6" rx="3" fill="#B8860B"/>
<ellipse cx="296.66666666666663" cy="298.9615242270663" rx="6" ry="11" fill="#F6C453"/>
<text x="296.7" y="370.0" font-size="12.5" fill="#F2E6C9" font-weight="700" text-anchor="middle">버가모</text>
<rect x="376.0" y="316.0" width="8" height="40" fill="#B8860B"/>
<rect x="366.0" y="354.0" width="28" height="6" rx="3" fill="#B8860B"/>
<ellipse cx="380.0" cy="307.0" rx="6" ry="11" fill="#F6C453"/>
<text x="380.0" y="378.0" font-size="12.5" fill="#F2E6C9" font-weight="700" text-anchor="middle">두아디라</text>
<rect x="459.3333333333333" y="307.9615242270663" width="8" height="40" fill="#B8860B"/>
<rect x="449.3333333333333" y="345.9615242270663" width="28" height="6" rx="3" fill="#B8860B"/>
<ellipse cx="463.3333333333333" cy="298.9615242270663" rx="6" ry="11" fill="#F6C453"/>
<text x="463.3" y="370.0" font-size="12.5" fill="#F2E6C9" font-weight="700" text-anchor="middle">사데</text>
<rect x="542.6666666666666" y="286.0" width="8" height="40" fill="#B8860B"/>
<rect x="532.6666666666666" y="324.0" width="28" height="6" rx="3" fill="#B8860B"/>
<ellipse cx="546.6666666666666" cy="277.0" rx="6" ry="11" fill="#F6C453"/>
<text x="546.7" y="348.0" font-size="12.5" fill="#F2E6C9" font-weight="700" text-anchor="middle">빌라델비아</text>
<rect x="626.0" y="256.0" width="8" height="40" fill="#B8860B"/>
<rect x="616.0" y="294.0" width="28" height="6" rx="3" fill="#B8860B"/>
<ellipse cx="630.0" cy="247.0" rx="6" ry="11" fill="#F6C453"/>
<text x="630.0" y="318.0" font-size="12.5" fill="#F2E6C9" font-weight="700" text-anchor="middle">라오디게아</text>
<circle cx="380" cy="190" r="46" fill="#F6E7B8" opacity="0.25"/>
<circle cx="380" cy="190" r="26" fill="#FFF6DA"/>
<text x="380.0" y="256.0" font-size="15" fill="#FFF6DA" font-weight="700" text-anchor="middle">인자 같은 이</text>
<circle cx="468.0" cy="172.0" r="3.5" fill="#FFFFFF"/>
<circle cx="462.7" cy="182.9" r="3.5" fill="#FFFFFF"/>
<circle cx="450.9" cy="185.6" r="3.5" fill="#FFFFFF"/>
<circle cx="441.4" cy="178.1" r="3.5" fill="#FFFFFF"/>
<circle cx="441.4" cy="165.9" r="3.5" fill="#FFFFFF"/>
<circle cx="450.9" cy="158.4" r="3.5" fill="#FFFFFF"/>
<circle cx="462.7" cy="161.1" r="3.5" fill="#FFFFFF"/>
<text x="476.0" y="176.0" font-size="12" fill="#FFF6DA" font-weight="400" text-anchor="start">오른손의 일곱 별</text>
<text x="80.0" y="140.0" font-size="13" fill="#F6C453" font-weight="700" text-anchor="start">1:12–16</text>
<rect x="730.0" y="112.0" width="810.0" height="300.0" rx="16" fill="#F7F4F1" stroke="none"/>
<text x="754.0" y="148.0" font-size="20" fill="#2A211B" font-weight="700" text-anchor="start">환상의 뜻</text>
<text x="754.0" y="188.0" font-size="16" fill="#B8860B" font-weight="700" text-anchor="start">일곱 금 촛대</text>
<text x="1000.0" y="188.0" font-size="15" fill="#2A211B" font-weight="400" text-anchor="start">= 일곱 교회 (1:20)</text>
<text x="754.0" y="222.0" font-size="16" fill="#B8860B" font-weight="700" text-anchor="start">일곱 별</text>
<text x="1000.0" y="222.0" font-size="15" fill="#2A211B" font-weight="400" text-anchor="start">= 일곱 교회의 사자 (1:20)</text>
<text x="754.0" y="256.0" font-size="16" fill="#B8860B" font-weight="700" text-anchor="start">촛대 사이의 인자 같은 이</text>
<text x="1000.0" y="256.0" font-size="15" fill="#2A211B" font-weight="400" text-anchor="start">= 영광의 그리스도 — 「처음이요 나중이니 곧 산 자라」(1:17–18)</text>
<text x="754.0" y="310.0" font-size="15" fill="#2A211B" font-weight="700" text-anchor="start">→ 영광의 그리스도께서 교회들 한가운데를 다니시며 교회를 붙들고 계신다.</text>
<text x="754.0" y="340.0" font-size="15" fill="#2A211B" font-weight="400" text-anchor="start">→ 하늘 보좌(4장)와 두루마리(5장)를 보기 전에, 먼저 땅의 교회를 살피시는 주님을 본다.</text>
<text x="754.0" y="370.0" font-size="15" fill="#2A211B" font-weight="400" text-anchor="start">→ 일곱 편지는 모두 1장 환상 속 그리스도의 모습 하나로 시작해, 이기는 자에게 주시는 약속으로 끝난다.</text>
<rect x="60.0" y="432.0" width="202.9" height="446.0" rx="12" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="60.0" y="432.0" width="202.9" height="44.0" rx="12" fill="#2A2F3F" stroke="none"/>
<rect x="60.0" y="462.0" width="202.9" height="14.0" rx="0" fill="#2A2F3F" stroke="none"/>
<circle cx="82.0" cy="454" r="12" fill="#B8860B"/>
<text x="82.0" y="459.0" font-size="13" fill="#2A2F3F" font-weight="700" text-anchor="middle">1</text>
<text x="102.0" y="461.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">에베소</text>
<text x="72.0" y="502.0" font-size="12.5" fill="#B8860B" font-weight="700" text-anchor="start">그리스도</text>
<text x="72.0" y="522.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">일곱 별을 붙잡고 일곱</text>
<text x="72.0" y="540.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">금촛대 사이에 다니시는</text>
<text x="72.0" y="558.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">이(2:1)</text>
<text x="72.0" y="590.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">칭찬</text>
<text x="72.0" y="610.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">수고 · 인내 · 거짓</text>
<text x="72.0" y="628.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">사도를 드러냄(2:2)</text>
<text x="72.0" y="660.0" font-size="12.5" fill="#952B38" font-weight="700" text-anchor="start">책망</text>
<text x="72.0" y="680.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「처음 사랑을</text>
<text x="72.0" y="698.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">버렸느니라」(2:4)</text>
<text x="72.0" y="730.0" font-size="12.5" fill="#9A6510" font-weight="700" text-anchor="start">이기는 자에게</text>
<text x="72.0" y="750.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">생명나무의 과실(2:7)</text>
<rect x="272.9" y="432.0" width="202.9" height="446.0" rx="12" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="272.9" y="432.0" width="202.9" height="44.0" rx="12" fill="#2A2F3F" stroke="none"/>
<rect x="272.9" y="462.0" width="202.9" height="14.0" rx="0" fill="#2A2F3F" stroke="none"/>
<circle cx="294.8571428571429" cy="454" r="12" fill="#B8860B"/>
<text x="294.9" y="459.0" font-size="13" fill="#2A2F3F" font-weight="700" text-anchor="middle">2</text>
<text x="314.9" y="461.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">서머나</text>
<text x="284.9" y="502.0" font-size="12.5" fill="#B8860B" font-weight="700" text-anchor="start">그리스도</text>
<text x="284.9" y="522.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">처음이요 나중이요</text>
<text x="284.9" y="540.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">죽었다가 살아나신</text>
<text x="284.9" y="558.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">이(2:8)</text>
<text x="284.9" y="590.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">칭찬</text>
<text x="284.9" y="610.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「환난과 궁핍 … 실상은</text>
<text x="284.9" y="628.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">네가 부요한</text>
<text x="284.9" y="646.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">자」(2:9)</text>
<text x="284.9" y="678.0" font-size="12.5" fill="#952B38" font-weight="700" text-anchor="start">책망</text>
<text x="284.9" y="698.0" font-size="13" fill="#952B38" font-weight="700" text-anchor="start">없음 — 「죽도록</text>
<text x="284.9" y="716.0" font-size="13" fill="#952B38" font-weight="700" text-anchor="start">충성하라」(2:10)</text>
<text x="284.9" y="748.0" font-size="12.5" fill="#9A6510" font-weight="700" text-anchor="start">이기는 자에게</text>
<text x="284.9" y="768.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">둘째 사망의 해를 받지</text>
<text x="284.9" y="786.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">않음(2:11)</text>
<rect x="485.7" y="432.0" width="202.9" height="446.0" rx="12" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="485.7" y="432.0" width="202.9" height="44.0" rx="12" fill="#2A2F3F" stroke="none"/>
<rect x="485.7" y="462.0" width="202.9" height="14.0" rx="0" fill="#2A2F3F" stroke="none"/>
<circle cx="507.7142857142857" cy="454" r="12" fill="#B8860B"/>
<text x="507.7" y="459.0" font-size="13" fill="#2A2F3F" font-weight="700" text-anchor="middle">3</text>
<text x="527.7" y="461.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">버가모</text>
<text x="497.7" y="502.0" font-size="12.5" fill="#B8860B" font-weight="700" text-anchor="start">그리스도</text>
<text x="497.7" y="522.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">좌우에 날선 검을 가진</text>
<text x="497.7" y="540.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">이(2:12)</text>
<text x="497.7" y="572.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">칭찬</text>
<text x="497.7" y="592.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「사단의 위가 있는</text>
<text x="497.7" y="610.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">데」서도 믿음을</text>
<text x="497.7" y="628.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">지킴(2:13)</text>
<text x="497.7" y="660.0" font-size="12.5" fill="#952B38" font-weight="700" text-anchor="start">책망</text>
<text x="497.7" y="680.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">발람의 교훈 · 우상의</text>
<text x="497.7" y="698.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">제물(2:14)</text>
<text x="497.7" y="730.0" font-size="12.5" fill="#9A6510" font-weight="700" text-anchor="start">이기는 자에게</text>
<text x="497.7" y="750.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">감추었던 만나 · 흰 돌</text>
<text x="497.7" y="768.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">· 새 이름(2:17)</text>
<rect x="698.6" y="432.0" width="202.9" height="446.0" rx="12" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="698.6" y="432.0" width="202.9" height="44.0" rx="12" fill="#2A2F3F" stroke="none"/>
<rect x="698.6" y="462.0" width="202.9" height="14.0" rx="0" fill="#2A2F3F" stroke="none"/>
<circle cx="720.5714285714286" cy="454" r="12" fill="#B8860B"/>
<text x="720.6" y="459.0" font-size="13" fill="#2A2F3F" font-weight="700" text-anchor="middle">4</text>
<text x="740.6" y="461.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">두아디라</text>
<text x="710.6" y="502.0" font-size="12.5" fill="#B8860B" font-weight="700" text-anchor="start">그리스도</text>
<text x="710.6" y="522.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">눈이 불꽃 같은 하나님의</text>
<text x="710.6" y="540.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">아들(2:18)</text>
<text x="710.6" y="572.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">칭찬</text>
<text x="710.6" y="592.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「나중 행위가 처음</text>
<text x="710.6" y="610.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">것보다</text>
<text x="710.6" y="628.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">많도다」(2:19)</text>
<text x="710.6" y="660.0" font-size="12.5" fill="#952B38" font-weight="700" text-anchor="start">책망</text>
<text x="710.6" y="680.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「여자 이세벨을 네가</text>
<text x="710.6" y="698.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">용납함」(2:20)</text>
<text x="710.6" y="730.0" font-size="12.5" fill="#9A6510" font-weight="700" text-anchor="start">이기는 자에게</text>
<text x="710.6" y="750.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">만국을 다스리는</text>
<text x="710.6" y="768.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">권세(2:26)</text>
<rect x="911.4" y="432.0" width="202.9" height="446.0" rx="12" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="911.4" y="432.0" width="202.9" height="44.0" rx="12" fill="#2A2F3F" stroke="none"/>
<rect x="911.4" y="462.0" width="202.9" height="14.0" rx="0" fill="#2A2F3F" stroke="none"/>
<circle cx="933.4285714285714" cy="454" r="12" fill="#B8860B"/>
<text x="933.4" y="459.0" font-size="13" fill="#2A2F3F" font-weight="700" text-anchor="middle">5</text>
<text x="953.4" y="461.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">사데</text>
<text x="923.4" y="502.0" font-size="12.5" fill="#B8860B" font-weight="700" text-anchor="start">그리스도</text>
<text x="923.4" y="522.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">하나님의 일곱 영과 일곱</text>
<text x="923.4" y="540.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">별을 가진 이(3:1)</text>
<text x="923.4" y="572.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">칭찬</text>
<text x="923.4" y="592.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">옷을 더럽히지 않은 「몇</text>
<text x="923.4" y="610.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">명」(3:4)</text>
<text x="923.4" y="642.0" font-size="12.5" fill="#952B38" font-weight="700" text-anchor="start">책망</text>
<text x="923.4" y="662.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「살았다 하는 이름은</text>
<text x="923.4" y="680.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">가졌으나 죽은</text>
<text x="923.4" y="698.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">자로다」(3:1)</text>
<text x="923.4" y="730.0" font-size="12.5" fill="#9A6510" font-weight="700" text-anchor="start">이기는 자에게</text>
<text x="923.4" y="750.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">흰 옷 · 생명책에서</text>
<text x="923.4" y="768.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">지우지 않음(3:5)</text>
<rect x="1124.3" y="432.0" width="202.9" height="446.0" rx="12" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="1124.3" y="432.0" width="202.9" height="44.0" rx="12" fill="#2A2F3F" stroke="none"/>
<rect x="1124.3" y="462.0" width="202.9" height="14.0" rx="0" fill="#2A2F3F" stroke="none"/>
<circle cx="1146.2857142857142" cy="454" r="12" fill="#B8860B"/>
<text x="1146.3" y="459.0" font-size="13" fill="#2A2F3F" font-weight="700" text-anchor="middle">6</text>
<text x="1166.3" y="461.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">빌라델비아</text>
<text x="1136.3" y="502.0" font-size="12.5" fill="#B8860B" font-weight="700" text-anchor="start">그리스도</text>
<text x="1136.3" y="522.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">다윗의 열쇠를 가지신</text>
<text x="1136.3" y="540.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">이(3:7)</text>
<text x="1136.3" y="572.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">칭찬</text>
<text x="1136.3" y="592.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「적은 능력을 가지고도</text>
<text x="1136.3" y="610.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">내 말을</text>
<text x="1136.3" y="628.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">지키며」(3:8)</text>
<text x="1136.3" y="660.0" font-size="12.5" fill="#952B38" font-weight="700" text-anchor="start">책망</text>
<text x="1136.3" y="680.0" font-size="13" fill="#952B38" font-weight="700" text-anchor="start">없음 — 「열린</text>
<text x="1136.3" y="698.0" font-size="13" fill="#952B38" font-weight="700" text-anchor="start">문」(3:8)</text>
<text x="1136.3" y="730.0" font-size="12.5" fill="#9A6510" font-weight="700" text-anchor="start">이기는 자에게</text>
<text x="1136.3" y="750.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">하나님 성전의 기둥 ·</text>
<text x="1136.3" y="768.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">새 예루살렘의</text>
<text x="1136.3" y="786.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">이름(3:12)</text>
<rect x="1337.1" y="432.0" width="202.9" height="446.0" rx="12" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="1337.1" y="432.0" width="202.9" height="44.0" rx="12" fill="#2A2F3F" stroke="none"/>
<rect x="1337.1" y="462.0" width="202.9" height="14.0" rx="0" fill="#2A2F3F" stroke="none"/>
<circle cx="1359.142857142857" cy="454" r="12" fill="#B8860B"/>
<text x="1359.1" y="459.0" font-size="13" fill="#2A2F3F" font-weight="700" text-anchor="middle">7</text>
<text x="1379.1" y="461.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">라오디게아</text>
<text x="1349.1" y="502.0" font-size="12.5" fill="#B8860B" font-weight="700" text-anchor="start">그리스도</text>
<text x="1349.1" y="522.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">아멘이시요 충성되고 참된</text>
<text x="1349.1" y="540.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">증인(3:14)</text>
<text x="1349.1" y="572.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">칭찬</text>
<text x="1349.1" y="592.0" font-size="13" fill="#2F7466" font-weight="700" text-anchor="start">없음</text>
<text x="1349.1" y="624.0" font-size="12.5" fill="#952B38" font-weight="700" text-anchor="start">책망</text>
<text x="1349.1" y="644.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「차지도 아니하고</text>
<text x="1349.1" y="662.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">더웁지도</text>
<text x="1349.1" y="680.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">아니하도다」(3:15)</text>
<text x="1349.1" y="712.0" font-size="12.5" fill="#9A6510" font-weight="700" text-anchor="start">이기는 자에게</text>
<text x="1349.1" y="732.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">「내 보좌에 함께</text>
<text x="1349.1" y="750.0" font-size="13" fill="#2A211B" font-weight="400" text-anchor="start">앉게」(3:21)</text>
<text x="60.0" y="896.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">책망이 없는 교회 둘(서머나 · 빌라델비아) · 칭찬이 없는 교회 하나(라오디게아) · 이기는 자에게 주신 약속(생명나무 · 새 이름 · 흰 옷 · 생명책 · 새 예루살렘 · 보좌)은 21–22장에서 이루어진다</text>
