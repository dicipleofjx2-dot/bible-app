<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60.0" y="62.0" font-size="32" fill="#2A211B" font-weight="700" text-anchor="start">요한계시록의 흐름 — 마태복음 24장 · 다니엘서와 함께</text>
<text x="60.0" y="94.0" font-size="16" fill="#6B5C52" font-weight="400" text-anchor="start">예수님의 종말 강화(감람산 강화)가 보여 준 순서 그대로 — 재난의 징조 → 대환난 → 재림 → 휴거 → 심판 → 새 하늘과 새 땅</text>
<line x1="230" y1="148" x2="1530" y2="148" stroke="#6B5C52" stroke-width="2"/>
<rect x="230.0" y="118.0" width="210.0" height="60.0" rx="10" fill="#9A6510" stroke="none"/>
