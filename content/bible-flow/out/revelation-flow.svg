<text x="60.0" y="870.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">후 3년 반 = 「마흔 두 달」(11:2, 13:5) = 「일천 이백 육십 일」(11:3, 12:6) = 「한 때와 두 때와 반 때」(12:14 · 단 7:25) — 다니엘의 「한 이레의 절반」(단 9:27)</text>
<text x="60.0" y="890.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">인 · 나팔 · 대접을 차례로 이어지는 일로 보는 해석을 따랐다(같은 일을 세 번 다른 각도로 본다는 해석도 있다). 휴거의 때는 마태복음 24장의 순서(24:29–31)를 따랐다.</text>
