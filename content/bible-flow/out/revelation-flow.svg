<text x="555.0" y="167.0" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="middle">계 8–16장 나팔 · 대접</text>
<path d="M661.0,140 L669.0,148 L661.0,156 Z" fill="#6B5C52"/>
<rect x="670.0" y="118.0" width="210.0" height="60.0" rx="10" fill="#2F7466" stroke="none"/>
<text x="775.0" y="145.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">재림</text>
<text x="775.0" y="167.0" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="middle">계 19장</text>
<path d="M881.0,140 L889.0,148 L881.0,156 Z" fill="#6B5C52"/>
<rect x="890.0" y="118.0" width="210.0" height="60.0" rx="10" fill="#5B6B7F" stroke="none"/>
<text x="995.0" y="145.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">휴거 (모으심)</text>
<text x="995.0" y="167.0" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="middle">계 14:14–16</text>
<path d="M1101.0,140 L1109.0,148 L1101.0,156 Z" fill="#6B5C52"/>
<rect x="1110.0" y="118.0" width="210.0" height="60.0" rx="10" fill="#4A3F38" stroke="none"/>
<text x="1215.0" y="145.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">심판</text>
<text x="1215.0" y="167.0" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="middle">계 17–20장</text>
<path d="M1321.0,140 L1329.0,148 L1321.0,156 Z" fill="#6B5C52"/>
<rect x="1330.0" y="118.0" width="210.0" height="60.0" rx="10" fill="#64457F" stroke="none"/>
<text x="1435.0" y="145.0" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">새 하늘과 새 땅</text>
<text x="1435.0" y="167.0" font-size="13" fill="#FFFFFF" font-weight="400" text-anchor="middle">계 21–22장</text>
<rect x="60.0" y="118.0" width="156.0" height="60.0" rx="10" fill="#F2F0EE" stroke="none"/>
<text x="138.0" y="145.0" font-size="14" fill="#2A211B" font-weight="700" text-anchor="middle">계 1–5장 서론</text>
<text x="138.0" y="165.0" font-size="12" fill="#6B5C52" font-weight="400" text-anchor="middle">그리스도 · 교회 · 보좌</text>
<rect x="60.0" y="192.0" width="156.0" height="204.0" rx="10" fill="#F3E7D2" stroke="none"/>
<text x="74.0" y="228.0" font-size="21" fill="#2A211B" font-weight="700" text-anchor="start">마태복음</text>
<text x="74.0" y="254.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">24–25장</text>
<text x="74.0" y="274.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">감람산 강화</text>
<rect x="230.0" y="192.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="230.0" y="192.0" width="210.0" height="6.0" rx="3" fill="#9A6510" stroke="none"/>
<text x="242.0" y="224.0" font-size="15" fill="#9A6510" font-weight="700" text-anchor="start">24:4–14</text>
<text x="242.0" y="250.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">「이 모든 것이 재난의</text>
<text x="242.0" y="271.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">시작이니라」(24:8) —</text>
<text x="242.0" y="292.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">거짓 그리스도 · 전쟁 ·</text>
<text x="242.0" y="313.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">기근 · 지진 · 박해</text>
<rect x="450.0" y="192.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="450.0" y="192.0" width="210.0" height="6.0" rx="3" fill="#952B38" stroke="none"/>
<text x="462.0" y="224.0" font-size="15" fill="#952B38" font-weight="700" text-anchor="start">24:15–28</text>
<text x="462.0" y="250.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">「멸망의 가증한</text>
<text x="462.0" y="271.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">것」(24:15) · 「그</text>
<text x="462.0" y="292.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">때에 큰 환난이</text>
<text x="462.0" y="313.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">있겠음이라」(24:21)</text>
<rect x="670.0" y="192.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="670.0" y="192.0" width="210.0" height="6.0" rx="3" fill="#2F7466" stroke="none"/>
<text x="682.0" y="224.0" font-size="15" fill="#2F7466" font-weight="700" text-anchor="start">24:29–30</text>
<text x="682.0" y="250.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">「그 날 환난 후에 즉시」 해</text>
<text x="682.0" y="271.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">· 달 · 별 — 「인자가</text>
<text x="682.0" y="292.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">구름을 타고 … 오는 것을</text>
<text x="682.0" y="313.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">보리라」</text>
<rect x="890.0" y="192.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="890.0" y="192.0" width="210.0" height="6.0" rx="3" fill="#5B6B7F" stroke="none"/>
<text x="902.0" y="224.0" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">24:31, 40</text>
<text x="902.0" y="250.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">「택하신 자들을 … 사방에서</text>
<text x="902.0" y="271.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">모으리라」 · 「하나는</text>
<text x="902.0" y="292.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">데려감을 당하고」 (살전</text>
<text x="902.0" y="313.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">4:17 「구름 속으로</text>
<text x="902.0" y="334.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">끌어올려」)</text>
<rect x="1110.0" y="192.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="1110.0" y="192.0" width="210.0" height="6.0" rx="3" fill="#4A3F38" stroke="none"/>
<text x="1122.0" y="224.0" font-size="15" fill="#4A3F38" font-weight="700" text-anchor="start">25:31–46</text>
<text x="1122.0" y="250.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">「영광의 보좌에 앉으리니」 —</text>
<text x="1122.0" y="271.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">양과 염소를 분별</text>
<rect x="1330.0" y="192.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="1330.0" y="192.0" width="210.0" height="6.0" rx="3" fill="#64457F" stroke="none"/>
<text x="1342.0" y="224.0" font-size="15" fill="#64457F" font-weight="700" text-anchor="start">24:35</text>
<text x="1342.0" y="250.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">「천지는 없어지겠으나 내 말은</text>
<text x="1342.0" y="271.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">없어지지 아니하리라」</text>
<rect x="60.0" y="406.0" width="156.0" height="204.0" rx="10" fill="#D9EAE6" stroke="none"/>
<text x="74.0" y="442.0" font-size="21" fill="#2A211B" font-weight="700" text-anchor="start">요한계시록</text>
<text x="74.0" y="468.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">1–5장 서론 뒤</text>
<text x="74.0" y="488.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">6–22장</text>
<rect x="230.0" y="406.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="230.0" y="406.0" width="210.0" height="6.0" rx="3" fill="#9A6510" stroke="none"/>
<text x="242.0" y="438.0" font-size="15" fill="#9A6510" font-weight="700" text-anchor="start">일곱 인 6–8:1</text>
<text x="242.0" y="464.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">재난의 징조 — 흰 말 ·</text>
<text x="242.0" y="485.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">붉은 말(전쟁) · 검은</text>
<text x="242.0" y="506.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">말(기근) · 청황색</text>
<text x="242.0" y="527.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">말(사망) · 순교자 · 해와</text>
<text x="242.0" y="548.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">달과 별(6:12–13)</text>
<rect x="450.0" y="406.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="450.0" y="406.0" width="210.0" height="6.0" rx="3" fill="#952B38" stroke="none"/>
<text x="462.0" y="438.0" font-size="15" fill="#952B38" font-weight="700" text-anchor="start">일곱 나팔 → 일곱 대접</text>
<text x="462.0" y="464.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">나팔(8–11장) = 후 3년</text>
<text x="462.0" y="485.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">반이 시작된다는 신호 ·</text>
<text x="462.0" y="506.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">대접(15–16장) = 후</text>
<text x="462.0" y="527.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">3년 반에 일어날 일 · 짐승</text>
<text x="462.0" y="548.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">「마흔 두 달」(13:5)</text>
<rect x="670.0" y="406.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="670.0" y="406.0" width="210.0" height="6.0" rx="3" fill="#2F7466" stroke="none"/>
<text x="682.0" y="438.0" font-size="15" fill="#2F7466" font-weight="700" text-anchor="start">19:11–16</text>
<text x="682.0" y="464.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">백마 탄 이 「만왕의 왕이요</text>
<text x="682.0" y="485.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">만주의 주」 · 「구름을 타고</text>
<text x="682.0" y="506.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">오시리라」(1:7)</text>
<rect x="890.0" y="406.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="890.0" y="406.0" width="210.0" height="6.0" rx="3" fill="#5B6B7F" stroke="none"/>
<text x="902.0" y="438.0" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">14:14–16</text>
<text x="902.0" y="464.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">「구름 위에 사람의 아들과</text>
<text x="902.0" y="485.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">같은 이」가 낫을 들고 땅의</text>
<text x="902.0" y="506.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">곡식을 거두다</text>
<rect x="1110.0" y="406.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="1110.0" y="406.0" width="210.0" height="6.0" rx="3" fill="#4A3F38" stroke="none"/>
<text x="1122.0" y="438.0" font-size="15" fill="#4A3F38" font-weight="700" text-anchor="start">17–20장</text>
<text x="1122.0" y="464.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">음녀 바벨론(17–18장) →</text>
<text x="1122.0" y="485.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">짐승(적그리스도)과 거짓</text>
<text x="1122.0" y="506.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">선지자(19:20) →</text>
<text x="1122.0" y="527.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">사단(20:10) → 크고 흰</text>
<text x="1122.0" y="548.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">보좌(20:11–12)</text>
<rect x="1330.0" y="406.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="1330.0" y="406.0" width="210.0" height="6.0" rx="3" fill="#64457F" stroke="none"/>
<text x="1342.0" y="438.0" font-size="15" fill="#64457F" font-weight="700" text-anchor="start">21–22장</text>
<text x="1342.0" y="464.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">「새 하늘과 새</text>
<text x="1342.0" y="485.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">땅」(21:1) · 새</text>
<text x="1342.0" y="506.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">예루살렘 · 생명나무</text>
<rect x="60.0" y="620.0" width="156.0" height="204.0" rx="10" fill="#E6E1EC" stroke="none"/>
<text x="74.0" y="656.0" font-size="21" fill="#2A211B" font-weight="700" text-anchor="start">다니엘</text>
<text x="74.0" y="682.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">2 · 7 · 9 · 12장</text>
<rect x="230.0" y="620.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="230.0" y="620.0" width="210.0" height="6.0" rx="3" fill="#9A6510" stroke="none"/>
<text x="242.0" y="652.0" font-size="15" fill="#9A6510" font-weight="700" text-anchor="start">7:3</text>
<text x="242.0" y="678.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">바다에서 나온 네 짐승 —</text>
<text x="242.0" y="699.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">세상 나라들이 일어나고</text>
<text x="242.0" y="720.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">무너진다</text>
<rect x="450.0" y="620.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="450.0" y="620.0" width="210.0" height="6.0" rx="3" fill="#952B38" stroke="none"/>
<text x="462.0" y="652.0" font-size="15" fill="#952B38" font-weight="700" text-anchor="start">9:27 · 7:25 · 12:1</text>
<text x="462.0" y="678.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">이레의 절반 · 「미운 물건」</text>
<text x="462.0" y="699.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">· 「한 때와 두 때와 반</text>
<text x="462.0" y="720.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">때」 · 「개국 이래로 …</text>
<text x="462.0" y="741.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">없던 환난」</text>
<rect x="670.0" y="620.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="670.0" y="620.0" width="210.0" height="6.0" rx="3" fill="#2F7466" stroke="none"/>
<text x="682.0" y="652.0" font-size="15" fill="#2F7466" font-weight="700" text-anchor="start">7:13</text>
<text x="682.0" y="678.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">「인자 같은 이가 하늘 구름을</text>
<text x="682.0" y="699.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">타고」</text>
<rect x="890.0" y="620.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="890.0" y="620.0" width="210.0" height="6.0" rx="3" fill="#5B6B7F" stroke="none"/>
<text x="902.0" y="652.0" font-size="15" fill="#5B6B7F" font-weight="700" text-anchor="start">12:1–2</text>
<text x="902.0" y="678.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">「책에 기록된 모든 자가</text>
<text x="902.0" y="699.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">구원을」 · 「자는 자 중에</text>
<text x="902.0" y="720.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">많이 깨어 영생을」</text>
<rect x="1110.0" y="620.0" width="210.0" height="204.0" rx="10" fill="#FFFFFF" stroke="#E3DDD7"/>
<rect x="1110.0" y="620.0" width="210.0" height="6.0" rx="3" fill="#4A3F38" stroke="none"/>
<text x="1122.0" y="652.0" font-size="15" fill="#4A3F38" font-weight="700" text-anchor="start">7:9–10</text>
