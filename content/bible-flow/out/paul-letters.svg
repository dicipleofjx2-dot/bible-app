<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60.0" y="68.0" font-size="34" fill="#2A211B" font-weight="700" text-anchor="start">바울서신 13권 — 언제, 어디서 썼나</text>
<text x="60.0" y="104.0" font-size="17" fill="#6B5C52" font-weight="400" text-anchor="start">전도여행과 감옥을 따라 · 카드 오른쪽 위 = 쓴 곳 · 연대는 모두 「약」 · 성경에 실린 순서가 아니라 쓴 순서</text>
<line x1="60" y1="150" x2="1528" y2="150" stroke="#6B5C52" stroke-width="3"/><path d="M1540,150 L1526,143 L1526,157 Z" fill="#6B5C52"/>
<circle cx="201.6" cy="150" r="10" fill="#B5532F" stroke="#FFFFFF" stroke-width="3"/>
<rect x="60.0" y="176" width="283.2" height="74" rx="12" fill="#B5532F"/>
<text x="201.6" y="208.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">1차 전도여행 뒤</text>
<text x="201.6" y="234.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="middle">약 AD 48–49</text>
<text x="201.6" y="278" font-size="15" fill="#B5532F" font-weight="700" text-anchor="middle">1권</text>
<rect x="60.0" y="292" width="283.2" height="132" rx="12" fill="#F2F0EE"/>
<rect x="76.0" y="310" width="22" height="15" rx="2" fill="#B5532F"/><path d="M76.0,310 L87.0,319 L98.0,310" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="108.0" y="324.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">갈라디아서</text>
<text x="329.2" y="324.0" font-size="12.5" fill="#B5532F" font-weight="700" text-anchor="end">안디옥 (돌아와서)</text>
<text x="76.0" y="352.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">다른 복음은 없다 — 율법의 행위가</text>
<text x="76.0" y="372.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">아니라 믿음으로 의롭게 되고, 성령을</text>
<text x="76.0" y="392.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">따라 자유롭게 산다</text>
<text x="64.0" y="840.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">남갈라디아설을 따름 — 예루살렘</text>
<text x="64.0" y="859.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">회의(행 15장) 전</text>
<circle cx="500.8" cy="150" r="10" fill="#2F7466" stroke="#FFFFFF" stroke-width="3"/>
<rect x="359.2" y="176" width="283.2" height="74" rx="12" fill="#2F7466"/>
<text x="500.8" y="208.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">2차 전도여행</text>
<text x="500.8" y="234.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="middle">약 AD 50–51</text>
<text x="500.8" y="278" font-size="15" fill="#2F7466" font-weight="700" text-anchor="middle">2권</text>
<rect x="359.2" y="292" width="283.2" height="132" rx="12" fill="#F2F0EE"/>
<rect x="375.2" y="310" width="22" height="15" rx="2" fill="#2F7466"/><path d="M375.2,310 L386.2,319 L397.2,310" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="407.2" y="324.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">데살로니가전서</text>
<text x="628.4" y="324.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="end">고린도</text>
<text x="375.2" y="352.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">박해 속 젊은 교회를 격려 — 주님이</text>
<text x="375.2" y="372.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">다시 오실 때 죽은 성도도 일어난다,</text>
<text x="375.2" y="392.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">거룩하게 살라</text>
<rect x="359.2" y="432" width="283.2" height="112" rx="12" fill="#F2F0EE"/>
<rect x="375.2" y="450" width="22" height="15" rx="2" fill="#2F7466"/><path d="M375.2,450 L386.2,459 L397.2,450" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="407.2" y="464.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">데살로니가후서</text>
<text x="628.4" y="464.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="end">고린도</text>
<text x="375.2" y="492.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">「주의 날이 벌써 왔다」는 말에</text>
<text x="375.2" y="512.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">흔들리지 말고 일하며 선을 행하라</text>
<text x="363.2" y="840.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">고린도에 1년 6개월 머물 때(행</text>
<text x="363.2" y="859.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">18:11)</text>
<circle cx="800.0" cy="150" r="10" fill="#64457F" stroke="#FFFFFF" stroke-width="3"/>
<rect x="658.4" y="176" width="283.2" height="74" rx="12" fill="#64457F"/>
<text x="800.0" y="208.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">3차 전도여행</text>
<text x="800.0" y="234.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="middle">약 AD 55–57</text>
<text x="800.0" y="278" font-size="15" fill="#64457F" font-weight="700" text-anchor="middle">3권</text>
<rect x="658.4" y="292" width="283.2" height="132" rx="12" fill="#F2F0EE"/>
<rect x="674.4" y="310" width="22" height="15" rx="2" fill="#64457F"/><path d="M674.4,310 L685.4,319 L696.4,310" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="706.4" y="324.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">고린도전서</text>
<text x="927.6" y="324.0" font-size="12.5" fill="#64457F" font-weight="700" text-anchor="end">에베소</text>
<text x="674.4" y="352.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">분쟁 · 음행 · 소송 · 결혼 ·</text>
<text x="674.4" y="372.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">은사 문제에 답하고 사랑(13장)과</text>
<text x="674.4" y="392.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">부활(15장)을 가르친다</text>
<rect x="658.4" y="432" width="283.2" height="132" rx="12" fill="#F2F0EE"/>
<rect x="674.4" y="450" width="22" height="15" rx="2" fill="#64457F"/><path d="M674.4,450 L685.4,459 L696.4,450" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="706.4" y="464.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">고린도후서</text>
<text x="927.6" y="464.0" font-size="12.5" fill="#64457F" font-weight="700" text-anchor="end">마게도냐</text>
<text x="674.4" y="492.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">약함 속에 나타나는 하나님의 능력 —</text>
<text x="674.4" y="512.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">사도직을 변호하고 화해의 직분과</text>
<text x="674.4" y="532.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">연보를 말한다</text>
<rect x="658.4" y="572" width="283.2" height="132" rx="12" fill="#F2F0EE"/>
<rect x="674.4" y="590" width="22" height="15" rx="2" fill="#64457F"/><path d="M674.4,590 L685.4,599 L696.4,590" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="706.4" y="604.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">로마서</text>
<text x="927.6" y="604.0" font-size="12.5" fill="#64457F" font-weight="700" text-anchor="end">고린도</text>
<text x="674.4" y="632.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">복음의 체계 — 모두가 죄인,</text>
<text x="674.4" y="652.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">믿음으로 의롭다 하심, 성령 안의 새</text>
<text x="674.4" y="672.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">삶, 이스라엘, 삶의 예배</text>
<text x="662.4" y="840.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">에베소 3년 · 헬라 석 달</text>
<circle cx="1099.2" cy="150" r="10" fill="#952B38" stroke="#FFFFFF" stroke-width="3"/>
<rect x="957.6" y="176" width="283.2" height="74" rx="12" fill="#952B38"/>
<text x="1099.2" y="208.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">로마 감옥</text>
<text x="1099.2" y="234.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="middle">약 AD 60–62</text>
<text x="1099.2" y="278" font-size="15" fill="#952B38" font-weight="700" text-anchor="middle">4권</text>
<rect x="957.6" y="292" width="283.2" height="132" rx="12" fill="#F2F0EE"/>
<rect x="973.5999999999999" y="310" width="22" height="15" rx="2" fill="#952B38"/><path d="M973.5999999999999,310 L984.5999999999999,319 L995.5999999999999,310" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1005.6" y="324.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">에베소서</text>
<text x="1226.8" y="324.0" font-size="12.5" fill="#952B38" font-weight="700" text-anchor="end">로마</text>
<text x="973.6" y="352.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">그리스도 안에서 받은 복(1–3장)과</text>
<text x="973.6" y="372.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">그에 합당한 삶(4–6장) — 하나</text>
<text x="973.6" y="392.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">된 교회, 전신갑주</text>
<rect x="957.6" y="432" width="283.2" height="132" rx="12" fill="#F2F0EE"/>
<rect x="973.5999999999999" y="450" width="22" height="15" rx="2" fill="#952B38"/><path d="M973.5999999999999,450 L984.5999999999999,459 L995.5999999999999,450" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1005.6" y="464.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">빌립보서</text>
<text x="1226.8" y="464.0" font-size="12.5" fill="#952B38" font-weight="700" text-anchor="end">로마</text>
<text x="973.6" y="492.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">감옥에서 쓴 기쁨의 편지 —</text>
<text x="973.6" y="512.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">그리스도의 겸손을 본받고 주 안에서</text>
<text x="973.6" y="532.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">항상 기뻐하라</text>
<rect x="957.6" y="572" width="283.2" height="132" rx="12" fill="#F2F0EE"/>
<rect x="973.5999999999999" y="590" width="22" height="15" rx="2" fill="#952B38"/><path d="M973.5999999999999,590 L984.5999999999999,599 L995.5999999999999,590" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1005.6" y="604.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">골로새서</text>
<text x="1226.8" y="604.0" font-size="12.5" fill="#952B38" font-weight="700" text-anchor="end">로마</text>
<text x="973.6" y="632.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">그리스도만으로 충분하다 — 만물의</text>
<text x="973.6" y="652.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">으뜸이신 그리스도, 헛된 철학과</text>
<text x="973.6" y="672.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">규례를 경계</text>
<rect x="957.6" y="712" width="283.2" height="112" rx="12" fill="#F2F0EE"/>
<rect x="973.5999999999999" y="730" width="22" height="15" rx="2" fill="#952B38"/><path d="M973.5999999999999,730 L984.5999999999999,739 L995.5999999999999,730" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1005.6" y="744.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">빌레몬서</text>
<text x="1226.8" y="744.0" font-size="12.5" fill="#952B38" font-weight="700" text-anchor="end">로마</text>
<text x="973.6" y="772.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">도망친 종 오네시모를 사랑받는 형제로</text>
<text x="973.6" y="792.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">받아 달라는 부탁</text>
<text x="961.6" y="840.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">옥중서신 — 셋집 2년(행</text>
<text x="961.6" y="859.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">28:30)</text>
<circle cx="1398.4" cy="150" r="10" fill="#4A3F38" stroke="#FFFFFF" stroke-width="3"/>
<rect x="1256.8" y="176" width="283.2" height="74" rx="12" fill="#4A3F38"/>
<text x="1398.4" y="208.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">로마 감옥 이후</text>
<text x="1398.4" y="234.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="middle">약 AD 62–67 (전통)</text>
<text x="1398.4" y="278" font-size="15" fill="#4A3F38" font-weight="700" text-anchor="middle">3권</text>
<rect x="1256.8" y="292" width="283.2" height="132" rx="12" fill="#F2F0EE"/>
<rect x="1272.8" y="310" width="22" height="15" rx="2" fill="#4A3F38"/><path d="M1272.8,310 L1283.8,319 L1294.8,310" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1304.8" y="324.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">디모데전서</text>
<text x="1526.0" y="324.0" font-size="12.5" fill="#4A3F38" font-weight="700" text-anchor="end">마게도냐 무렵</text>
<text x="1272.8" y="352.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">거짓 교훈을 막고 예배와 직분(감독</text>
<text x="1272.8" y="372.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">· 집사)으로 하나님의 집을 바르게</text>
<text x="1272.8" y="392.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">세우라</text>
<rect x="1256.8" y="432" width="283.2" height="112" rx="12" fill="#F2F0EE"/>
<rect x="1272.8" y="450" width="22" height="15" rx="2" fill="#4A3F38"/><path d="M1272.8,450 L1283.8,459 L1294.8,450" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1304.8" y="464.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">디도서</text>
<text x="1526.0" y="464.0" font-size="12.5" fill="#4A3F38" font-weight="700" text-anchor="end">풀려난 뒤</text>
<text x="1272.8" y="492.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">그레데 교회에 장로를 세우라 —</text>
<text x="1272.8" y="512.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">은혜받은 사람은 선한 일에 힘쓴다</text>
<rect x="1256.8" y="552" width="283.2" height="132" rx="12" fill="#F2F0EE"/>
<rect x="1272.8" y="570" width="22" height="15" rx="2" fill="#4A3F38"/><path d="M1272.8,570 L1283.8,579 L1294.8,570" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1304.8" y="584.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">디모데후서</text>
<text x="1526.0" y="584.0" font-size="12.5" fill="#4A3F38" font-weight="700" text-anchor="end">로마 (다시 갇힘)</text>
<text x="1272.8" y="612.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">순교를 앞둔 마지막 당부 — 고난을</text>
<text x="1272.8" y="632.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">받으며 말씀을 전파하라, 「선한</text>
<text x="1272.8" y="652.0" font-size="13.5" fill="#2A211B" font-weight="400" text-anchor="start">싸움을 싸우고」</text>
<text x="1260.8" y="840.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">목회서신 — 사도행전 이후, 전통에</text>
<text x="1260.8" y="859.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">기댐</text>
</svg>