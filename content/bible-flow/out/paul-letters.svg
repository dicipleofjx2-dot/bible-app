<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60.0" y="68.0" font-size="34" fill="#2A211B" font-weight="700" text-anchor="start">바울서신 13권 — 언제, 어디서 썼나</text>
<text x="60.0" y="104.0" font-size="17" fill="#6B5C52" font-weight="400" text-anchor="start">전도여행과 감옥을 따라 · 연대는 모두 「약」 · 성경에 실린 순서가 아니라 쓴 순서</text>
<line x1="60" y1="150" x2="1528" y2="150" stroke="#6B5C52" stroke-width="3"/><path d="M1540,150 L1526,143 L1526,157 Z" fill="#6B5C52"/>
<circle cx="201.6" cy="150" r="10" fill="#B5532F" stroke="#FFFFFF" stroke-width="3"/>
<rect x="60.0" y="176" width="283.2" height="74" rx="12" fill="#B5532F"/>
<text x="201.6" y="208.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">1차 전도여행 뒤</text>
<text x="201.6" y="234.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="middle">약 AD 48–49</text>
<text x="201.6" y="282" font-size="15" fill="#B5532F" font-weight="700" text-anchor="middle">1권</text>
<rect x="60.0" y="300" width="283.2" height="152" rx="12" fill="#F2F0EE"/>
<rect x="76.0" y="320" width="22" height="15" rx="2" fill="#B5532F"/><path d="M76.0,320 L87.0,329 L98.0,320" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="108.0" y="334.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">갈라디아서</text>
<text x="76.0" y="360.0" font-size="14" fill="#B5532F" font-weight="700" text-anchor="start">쓴 곳 — 안디옥 (돌아와서)</text>
<text x="76.0" y="384.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">1차 여행에서 세운 갈라디아</text>
<text x="76.0" y="403.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">속주 교회들에게 — 「다른 복음</text>
<text x="76.0" y="422.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">좇는 것을 이상히 여기노라」(갈</text>
<text x="76.0" y="441.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">1:6)</text>
<text x="64.0" y="840.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">남갈라디아설을 따름 — 예루살렘</text>
<text x="64.0" y="859.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">회의(행 15장) 전</text>
<circle cx="500.8" cy="150" r="10" fill="#2F7466" stroke="#FFFFFF" stroke-width="3"/>
<rect x="359.2" y="176" width="283.2" height="74" rx="12" fill="#2F7466"/>
<text x="500.8" y="208.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">2차 전도여행</text>
<text x="500.8" y="234.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="middle">약 AD 50–51</text>
<text x="500.8" y="282" font-size="15" fill="#2F7466" font-weight="700" text-anchor="middle">2권</text>
<rect x="359.2" y="300" width="283.2" height="114" rx="12" fill="#F2F0EE"/>
<rect x="375.2" y="320" width="22" height="15" rx="2" fill="#2F7466"/><path d="M375.2,320 L386.2,329 L397.2,320" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="407.2" y="334.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">데살로니가전서</text>
<text x="375.2" y="360.0" font-size="14" fill="#2F7466" font-weight="700" text-anchor="start">쓴 곳 — 고린도</text>
<text x="375.2" y="384.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">재림의 소망 — 디모데의 소식을</text>
<text x="375.2" y="403.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">듣고(살전 3:6)</text>
<rect x="359.2" y="424" width="283.2" height="95" rx="12" fill="#F2F0EE"/>
<rect x="375.2" y="444" width="22" height="15" rx="2" fill="#2F7466"/><path d="M375.2,444 L386.2,453 L397.2,444" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="407.2" y="458.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">데살로니가후서</text>
<text x="375.2" y="484.0" font-size="14" fill="#2F7466" font-weight="700" text-anchor="start">쓴 곳 — 고린도</text>
<text x="375.2" y="508.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">재림을 기다리며 일상을 지키라</text>
<text x="363.2" y="840.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">고린도에 1년 6개월 머물 때(행</text>
<text x="363.2" y="859.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">18:11)</text>
<circle cx="800.0" cy="150" r="10" fill="#64457F" stroke="#FFFFFF" stroke-width="3"/>
<rect x="658.4" y="176" width="283.2" height="74" rx="12" fill="#64457F"/>
<text x="800.0" y="208.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">3차 전도여행</text>
<text x="800.0" y="234.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="middle">약 AD 55–57</text>
<text x="800.0" y="282" font-size="15" fill="#64457F" font-weight="700" text-anchor="middle">3권</text>
<rect x="658.4" y="300" width="283.2" height="114" rx="12" fill="#F2F0EE"/>
<rect x="674.4" y="320" width="22" height="15" rx="2" fill="#64457F"/><path d="M674.4,320 L685.4,329 L696.4,320" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="706.4" y="334.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">고린도전서</text>
<text x="674.4" y="360.0" font-size="14" fill="#64457F" font-weight="700" text-anchor="start">쓴 곳 — 에베소</text>
<text x="674.4" y="384.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">「오순절까지 에베소에 유하려</text>
<text x="674.4" y="403.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">함은」(고전 16:8)</text>
<rect x="658.4" y="424" width="283.2" height="114" rx="12" fill="#F2F0EE"/>
<rect x="674.4" y="444" width="22" height="15" rx="2" fill="#64457F"/><path d="M674.4,444 L685.4,453 L696.4,444" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="706.4" y="458.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">고린도후서</text>
<text x="674.4" y="484.0" font-size="14" fill="#64457F" font-weight="700" text-anchor="start">쓴 곳 — 마게도냐</text>
<text x="674.4" y="508.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">「마게도냐에 이르렀을</text>
<text x="674.4" y="527.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">때에도」(고후 7:5)</text>
<rect x="658.4" y="548" width="283.2" height="114" rx="12" fill="#F2F0EE"/>
<rect x="674.4" y="568" width="22" height="15" rx="2" fill="#64457F"/><path d="M674.4,568 L685.4,577 L696.4,568" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="706.4" y="582.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">로마서</text>
<text x="674.4" y="608.0" font-size="14" fill="#64457F" font-weight="700" text-anchor="start">쓴 곳 — 고린도</text>
<text x="674.4" y="632.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">겐그레아의 뵈뵈를 천거(롬</text>
<text x="674.4" y="651.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">16:1) · 행 20:2–3</text>
<text x="662.4" y="840.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">에베소 3년 · 헬라 석 달</text>
<circle cx="1099.2" cy="150" r="10" fill="#952B38" stroke="#FFFFFF" stroke-width="3"/>
<rect x="957.6" y="176" width="283.2" height="74" rx="12" fill="#952B38"/>
<text x="1099.2" y="208.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">로마 감옥</text>
<text x="1099.2" y="234.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="middle">약 AD 60–62</text>
<text x="1099.2" y="282" font-size="15" fill="#952B38" font-weight="700" text-anchor="middle">4권</text>
<rect x="957.6" y="300" width="283.2" height="114" rx="12" fill="#F2F0EE"/>
<rect x="973.5999999999999" y="320" width="22" height="15" rx="2" fill="#952B38"/><path d="M973.5999999999999,320 L984.5999999999999,329 L995.5999999999999,320" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1005.6" y="334.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">에베소서</text>
<text x="973.6" y="360.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">쓴 곳 — 로마</text>
<text x="973.6" y="384.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">「쇠사슬에 매인 사신」(엡</text>
<text x="973.6" y="403.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">6:20)</text>
<rect x="957.6" y="424" width="283.2" height="114" rx="12" fill="#F2F0EE"/>
<rect x="973.5999999999999" y="444" width="22" height="15" rx="2" fill="#952B38"/><path d="M973.5999999999999,444 L984.5999999999999,453 L995.5999999999999,444" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1005.6" y="458.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">빌립보서</text>
<text x="973.6" y="484.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">쓴 곳 — 로마</text>
<text x="973.6" y="508.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">「가이사 집 사람 중 몇」(빌</text>
<text x="973.6" y="527.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">4:22)</text>
<rect x="957.6" y="548" width="283.2" height="114" rx="12" fill="#F2F0EE"/>
<rect x="973.5999999999999" y="568" width="22" height="15" rx="2" fill="#952B38"/><path d="M973.5999999999999,568 L984.5999999999999,577 L995.5999999999999,568" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1005.6" y="582.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">골로새서</text>
<text x="973.6" y="608.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">쓴 곳 — 로마</text>
<text x="973.6" y="632.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">두기고 · 오네시모 편에(골</text>
<text x="973.6" y="651.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">4:7–9)</text>
<rect x="957.6" y="672" width="283.2" height="95" rx="12" fill="#F2F0EE"/>
<rect x="973.5999999999999" y="692" width="22" height="15" rx="2" fill="#952B38"/><path d="M973.5999999999999,692 L984.5999999999999,701 L995.5999999999999,692" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1005.6" y="706.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">빌레몬서</text>
<text x="973.6" y="732.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">쓴 곳 — 로마</text>
<text x="973.6" y="756.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">「갇힌 자 되어」(몬 1:9)</text>
<text x="961.6" y="840.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">옥중서신 — 셋집 2년(행</text>
<text x="961.6" y="859.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">28:30)</text>
<circle cx="1398.4" cy="150" r="10" fill="#4A3F38" stroke="#FFFFFF" stroke-width="3"/>
<rect x="1256.8" y="176" width="283.2" height="74" rx="12" fill="#4A3F38"/>
<text x="1398.4" y="208.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="middle">로마 감옥 이후</text>
<text x="1398.4" y="234.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="middle">약 AD 62–67 (전통)</text>
<text x="1398.4" y="282" font-size="15" fill="#4A3F38" font-weight="700" text-anchor="middle">3권</text>
<rect x="1256.8" y="300" width="283.2" height="114" rx="12" fill="#F2F0EE"/>
<rect x="1272.8" y="320" width="22" height="15" rx="2" fill="#4A3F38"/><path d="M1272.8,320 L1283.8,329 L1294.8,320" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1304.8" y="334.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">디모데전서</text>
<text x="1272.8" y="360.0" font-size="14" fill="#4A3F38" font-weight="700" text-anchor="start">쓴 곳 — 마게도냐 무렵</text>
<text x="1272.8" y="384.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">풀려난 뒤 — 에베소의</text>
<text x="1272.8" y="403.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">디모데에게(딤전 1:3)</text>
<rect x="1256.8" y="424" width="283.2" height="133" rx="12" fill="#F2F0EE"/>
<rect x="1272.8" y="444" width="22" height="15" rx="2" fill="#4A3F38"/><path d="M1272.8,444 L1283.8,453 L1294.8,444" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1304.8" y="458.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">디도서</text>
<text x="1272.8" y="484.0" font-size="14" fill="#4A3F38" font-weight="700" text-anchor="start">쓴 곳 — 풀려난 뒤</text>
<text x="1272.8" y="508.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">그레데의 디도에게 —</text>
<text x="1272.8" y="527.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">니고볼리에서 겨울을 나려 함(딛</text>
<text x="1272.8" y="546.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">3:12)</text>
<rect x="1256.8" y="567" width="283.2" height="133" rx="12" fill="#F2F0EE"/>
<rect x="1272.8" y="587" width="22" height="15" rx="2" fill="#4A3F38"/><path d="M1272.8,587 L1283.8,596 L1294.8,587" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<text x="1304.8" y="601.0" font-size="18" fill="#2A211B" font-weight="700" text-anchor="start">디모데후서</text>
<text x="1272.8" y="627.0" font-size="14" fill="#4A3F38" font-weight="700" text-anchor="start">쓴 곳 — 로마 (다시 갇힘)</text>
<text x="1272.8" y="651.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">마지막 편지 — 「관제와 같이</text>
<text x="1272.8" y="670.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">… 떠날 기약이</text>
<text x="1272.8" y="689.0" font-size="13" fill="#6B5C52" font-weight="400" text-anchor="start">가까왔도다」(딤후 4:6)</text>
<text x="1260.8" y="840.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">목회서신 — 사도행전 이후, 전통에</text>
<text x="1260.8" y="859.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">기댐</text>
</svg>