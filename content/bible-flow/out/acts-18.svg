<text x="111.0" y="804.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">핍박</text>
<text x="152.0" y="805.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">(예루살렘 칸의 어두운 장도 핍박) 핍박이 올 때마다 복음은 다음 무대로 넘어갔다 — 스데반의 순교가 사마리아로, 야고보의 순교 뒤에 땅 끝으로.</text>
<rect x="84.0" y="822.0" width="54.0" height="26.0" rx="13" fill="#3E8E5A" stroke="none" stroke-width="0"/>
<text x="111.0" y="840.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">흥왕</text>
<text x="152.0" y="841.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">누가는 무대가 바뀔 때마다 「말씀이 흥왕하였다」로 매듭짓는다 — 6:7 · 9:31 · 12:24 · 16:5 · 19:20 · 28:31</text>
