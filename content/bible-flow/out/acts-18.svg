<text x="1476.7" y="344.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="middle">로마</text>
<text x="1476.7" y="376.0" font-size="12" fill="#6B5C52" font-weight="400" text-anchor="middle">「담대히 …</text>
<text x="1476.7" y="392.6" font-size="12" fill="#6B5C52" font-weight="400" text-anchor="middle">금하는 사람이</text>
<text x="1476.7" y="409.1" font-size="12" fill="#6B5C52" font-weight="400" text-anchor="middle">없었더라」</text>
<text x="1476.7" y="425.7" font-size="12" fill="#6B5C52" font-weight="400" text-anchor="middle">(28:31)</text>
