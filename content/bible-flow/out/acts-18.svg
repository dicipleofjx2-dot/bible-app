<text x="1476.7" y="490.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">핍박</text>
<rect x="1421.3" y="692.0" width="110.7" height="46.0" rx="10" fill="#3E8E5A" stroke="none" stroke-width="0"/>
<text x="1476.7" y="712.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">말씀이 흥왕</text>
<text x="1476.7" y="730.0" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="middle">28:31</text>
<rect x="60.0" y="760.0" width="1480.0" height="96.0" rx="12" fill="#F2F0EE" stroke="none" stroke-width="0"/>
