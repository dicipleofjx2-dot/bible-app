<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60.0" y="62.0" font-size="32" fill="#2A211B" font-weight="700" text-anchor="start">로마의 세 시대 — 왕정 · 공화정 · 제정</text>
<text x="60.0" y="94.0" font-size="16" fill="#6B5C52" font-weight="400" text-anchor="start">시대의 폭 = 실제 기간 · 연대는 모두 「약」 · 초록 글씨 = 성경과 닿는 곳</text>
<rect x="60.0" y="118.0" width="300.0" height="92.0" rx="12" fill="#8C7B6E" stroke="none"/>
<text x="78.0" y="152.0" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start">왕정</text>
<text x="344.0" y="150.0" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="end">BC 753 – BC 509</text>
<text x="78.0" y="178.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start">왕이 다스리던 작은 도시</text>
<text x="78.0" y="198.0" font-size="12.5" fill="#FFFFFF" font-weight="400" text-anchor="start">다스림: 일곱 왕 · 약 244년</text>
<rect x="60.0" y="224.0" width="300.0" height="150.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="72.0" y="248.0" font-size="14" fill="#8C7B6E" font-weight="700" text-anchor="start">BC 753</text>
<text x="72.0" y="270.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">로마 건국 (전설)</text>
<text x="72.0" y="290.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">로물루스가 세웠다고 전한다</text>
<text x="72.0" y="309.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">같은 무렵 이사야 · 호세아</text>
<rect x="60.0" y="382.0" width="300.0" height="150.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="72.0" y="406.0" font-size="14" fill="#8C7B6E" font-weight="700" text-anchor="start">BC 700–509</text>
<text x="72.0" y="428.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">일곱 왕 시대</text>
<text x="72.0" y="448.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">북쪽 에트루리아의 영향을 받으며 자람</text>
<text x="72.0" y="467.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">북이스라엘 멸망 722 · 남유다 멸망</text>
<text x="72.0" y="484.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">586</text>
<rect x="60.0" y="540.0" width="300.0" height="150.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="72.0" y="564.0" font-size="14" fill="#8C7B6E" font-weight="700" text-anchor="start">BC 509</text>
<text x="72.0" y="586.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">마지막 왕 추방</text>
<text x="72.0" y="606.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">타르퀴니우스를 쫓아내고 왕정을 끝냄</text>
<text x="72.0" y="625.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">포로 귀환 538 · 성전 재건 516</text>
<rect x="374.0" y="118.0" width="563.7" height="92.0" rx="12" fill="#5B6B7F" stroke="none"/>
<text x="392.0" y="152.0" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start">공화정</text>
<text x="921.7" y="150.0" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="end">BC 509 – BC 27</text>
<text x="392.0" y="178.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start">원로원과 집정관이 다스림 — 지중해의 패자로</text>
<text x="392.0" y="198.0" font-size="12.5" fill="#FFFFFF" font-weight="400" text-anchor="start">다스림: 원로원 · 집정관 2명 · 약 482년</text>
<rect x="374.0" y="224.0" width="276.9" height="96.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="386.0" y="248.0" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">BC 509</text>
<text x="386.0" y="270.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">공화정 시작</text>
<text x="386.0" y="290.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">해마다 뽑는 집정관 두 명 ·</text>
<text x="386.0" y="307.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">원로원</text>
<rect x="374.0" y="328.0" width="276.9" height="117.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="386.0" y="352.0" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">BC 450</text>
<text x="386.0" y="374.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">12표법</text>
<text x="386.0" y="394.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">로마 최초의 성문법 — 로마법의</text>
<text x="386.0" y="411.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">출발</text>
<text x="386.0" y="430.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">에스라 · 느헤미야 · 말라기 무렵</text>
<rect x="374.0" y="453.0" width="276.9" height="134.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="386.0" y="477.0" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">BC 264–146</text>
<text x="386.0" y="499.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">포에니 전쟁</text>
<text x="386.0" y="519.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">카르타고(한니발)를 꺾고 지중해를</text>
<text x="386.0" y="536.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">손에 넣음 · 146 카르타고 ·</text>
<text x="386.0" y="553.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">고린도 파괴</text>
<text x="386.0" y="572.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">중간기 — 헬라 시대</text>
<rect x="660.9" y="224.0" width="276.9" height="100.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="672.9" y="248.0" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">BC 63</text>
<text x="672.9" y="270.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">폼페이우스, 예루살렘 점령</text>
<text x="672.9" y="290.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">유대가 로마의 손 아래 들어옴</text>
<text x="672.9" y="309.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">유대가 로마 지배로</text>
<rect x="660.9" y="332.0" width="276.9" height="96.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="672.9" y="356.0" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">BC 49–44</text>
<text x="672.9" y="378.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">율리우스 카이사르</text>
<text x="672.9" y="398.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">루비콘 강을 건너 권력을 쥐고 종신</text>
<text x="672.9" y="415.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">독재관이 되었다가 암살됨</text>
<rect x="660.9" y="436.0" width="276.9" height="117.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="672.9" y="460.0" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">BC 37</text>
<text x="672.9" y="482.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">헤롯, 유대의 왕</text>
<text x="672.9" y="502.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">로마 원로원이 세운 왕 — 로마군과</text>
<text x="672.9" y="519.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">예루살렘 차지</text>
<text x="672.9" y="538.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">헤롯 가문의 유대 통치 시작</text>
<rect x="660.9" y="561.0" width="276.9" height="96.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="672.9" y="585.0" font-size="14" fill="#5B6B7F" font-weight="700" text-anchor="start">BC 31</text>
<text x="672.9" y="607.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">악티움 해전</text>
<text x="672.9" y="627.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">옥타비아누스가 안토니우스 ·</text>
<text x="672.9" y="644.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">클레오파트라를 꺾음 → 내전 끝</text>
<rect x="951.7" y="118.0" width="588.3" height="92.0" rx="12" fill="#952B38" stroke="none"/>
<text x="969.7" y="152.0" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start">제정</text>
<text x="1524.0" y="150.0" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="end">BC 27 – AD 476</text>
<text x="969.7" y="178.0" font-size="14" fill="#FFFFFF" font-weight="400" text-anchor="start">황제가 다스리는 제국 — 신약의 무대</text>
<text x="969.7" y="198.0" font-size="12.5" fill="#FFFFFF" font-weight="400" text-anchor="start">다스림: 황제 · 약 503년</text>
<rect x="951.7" y="224.0" width="289.1" height="117.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="963.7" y="248.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">BC 27</text>
<text x="963.7" y="270.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">아우구스투스, 첫 황제</text>
<text x="963.7" y="290.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">「로마의 평화」(팍스 로마나) 시작</text>
<text x="963.7" y="309.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">「가이사 아구스도」 호적령 — 예수님</text>
<text x="963.7" y="326.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">탄생(눅 2:1)</text>
<rect x="951.7" y="349.0" width="289.1" height="117.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="963.7" y="373.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">AD 14–37</text>
<text x="963.7" y="395.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">티베리우스</text>
<text x="963.7" y="415.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">두 번째 황제</text>
<text x="963.7" y="434.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">「디베료 가이사」 15년 — 세례</text>
<text x="963.7" y="451.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">요한 · 십자가(눅 3:1)</text>
<rect x="951.7" y="474.0" width="289.1" height="117.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="963.7" y="498.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">AD 49</text>
<text x="963.7" y="520.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">클라우디우스, 유대인 추방</text>
<text x="963.7" y="540.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">로마에서 유대인을 내쫓음</text>
<text x="963.7" y="559.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">아굴라 · 브리스길라가 고린도로(행</text>
<text x="963.7" y="576.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">18:2)</text>
<rect x="951.7" y="599.0" width="289.1" height="100.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="963.7" y="623.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">AD 64</text>
<text x="963.7" y="645.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">로마 대화재 · 네로 박해</text>
<text x="963.7" y="665.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">그리스도인에게 화재 책임을 씌움</text>
<text x="963.7" y="684.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">전통 — 베드로 · 바울 순교</text>
<rect x="951.7" y="707.0" width="289.1" height="117.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="963.7" y="731.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">AD 70</text>
<text x="963.7" y="753.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">예루살렘 성전 파괴</text>
<text x="963.7" y="773.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">티투스가 유대 반란을 진압</text>
<text x="963.7" y="792.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">「돌 하나도 돌 위에 남지 않고」(마</text>
<text x="963.7" y="809.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">24:2)</text>
<rect x="1250.9" y="224.0" width="289.1" height="79.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="1262.9" y="248.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">AD 80 · 81</text>
<text x="1262.9" y="270.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">콜로세움 · 티투스 개선문</text>
<text x="1262.9" y="290.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">전쟁의 전리품으로 세운 기념물</text>
<rect x="1250.9" y="311.0" width="289.1" height="117.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="1262.9" y="335.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">AD 81–96</text>
<text x="1262.9" y="357.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">도미티아누스</text>
<text x="1262.9" y="377.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">황제 숭배 강요</text>
<text x="1262.9" y="396.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">요한이 밧모 섬에서 요한계시록(계</text>
<text x="1262.9" y="413.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">1:9)</text>
<rect x="1250.9" y="436.0" width="289.1" height="96.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="1262.9" y="460.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">AD 96–180</text>
<text x="1262.9" y="482.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">오현제 시대</text>
<text x="1262.9" y="502.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">제국의 전성기 — 교회가 제국</text>
<text x="1262.9" y="519.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">곳곳으로</text>
<rect x="1250.9" y="540.0" width="289.1" height="79.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="1262.9" y="564.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">AD 303</text>
<text x="1262.9" y="586.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">디오클레티아누스 대박해</text>
<text x="1262.9" y="606.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">로마 최후 · 최대의 박해</text>
<rect x="1250.9" y="627.0" width="289.1" height="117.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="1262.9" y="651.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">AD 313 · 380</text>
<text x="1262.9" y="673.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">밀라노 칙령 · 국교</text>
<text x="1262.9" y="693.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">콘스탄티누스가 공인, 테오도시우스가</text>
<text x="1262.9" y="710.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">국교로</text>
<text x="1262.9" y="729.0" font-size="12.5" fill="#2F7466" font-weight="700" text-anchor="start">박해받던 교회가 제국의 종교로</text>
<rect x="1250.9" y="752.0" width="289.1" height="96.0" rx="10" fill="#F7F4F1" stroke="#E3DDD7"/>
<text x="1262.9" y="776.0" font-size="14" fill="#952B38" font-weight="700" text-anchor="start">AD 395 · 476</text>
<text x="1262.9" y="798.0" font-size="16" fill="#2A211B" font-weight="700" text-anchor="start">동서 분열 · 서로마 멸망</text>
<text x="1262.9" y="818.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">476 서로마 멸망 (동로마는</text>
<text x="1262.9" y="835.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">1453년까지)</text>
</svg>