<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60.0" y="64.0" font-size="34" fill="#2A211B" font-weight="700" text-anchor="start">요한계시록 — 장별 구조</text>
<text x="60.0" y="98.0" font-size="17" fill="#6B5C52" font-weight="400" text-anchor="start">「네가 본 것과 이제 있는 일과 장차 될 일을 기록하라」(계 1:19)</text>
<rect x="60.0" y="120.0" width="63.3" height="44.0" rx="10" fill="#9A6510"/>
<text x="91.6" y="142.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">네가 본 것</text>
<text x="91.6" y="158.0" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="middle">1장</text>
<rect x="127.3" y="120.0" width="130.5" height="44.0" rx="10" fill="#B5532F"/>
<text x="192.5" y="142.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">이제 있는 일</text>
<text x="192.5" y="158.0" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="middle">2–3장</text>
<rect x="261.8" y="120.0" width="1274.2" height="44.0" rx="10" fill="#2F7466"/>
<text x="898.9" y="142.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">장차 될 일</text>
<text x="898.9" y="158.0" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="middle">4–22장</text>
<rect x="60.0" y="186.0" width="8.0" height="50.0" rx="4" fill="#9A6510"/>
<rect x="60.0" y="242.0" width="8.0" height="106.0" rx="4" fill="#B5532F"/>
<rect x="60.0" y="354.0" width="8.0" height="106.0" rx="4" fill="#2F7466"/>
<rect x="60.0" y="466.0" width="8.0" height="106.0" rx="4" fill="#C7A15A"/>
<rect x="60.0" y="578.0" width="8.0" height="218.0" rx="4" fill="#B5532F"/>
<rect x="76.0" y="186.0" width="714.0" height="50.0" rx="8" fill="#F2EEEA"/>
<circle cx="104" cy="211.0" r="17" fill="#9A6510"/>
<text x="104.0" y="217.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="134.0" y="208.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">영광의 그리스도</text>
<text x="134.0" y="229.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">일곱 금 촛대 사이 · 「알파와 오메가」(1:8)</text>
<rect x="76.0" y="242.0" width="714.0" height="50.0" rx="8" fill="#F7F4F1"/>
<circle cx="104" cy="267.0" r="17" fill="#B5532F"/>
<text x="104.0" y="273.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="134.0" y="264.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">에베소 · 서머나 · 버가모 · 두아디라</text>
<text x="134.0" y="285.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">「처음 사랑을 버렸느니라」(2:4) · 「죽도록 충성하라」(2:10)</text>
<rect x="76.0" y="298.0" width="714.0" height="50.0" rx="8" fill="#F2EEEA"/>
<circle cx="104" cy="323.0" r="17" fill="#B5532F"/>
<text x="104.0" y="329.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="134.0" y="320.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">사데 · 빌라델비아 · 라오디게아</text>
<text x="134.0" y="341.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">「열린 문」(3:8) · 「문 밖에 서서 두드리노니」(3:20)</text>
<rect x="76.0" y="354.0" width="714.0" height="50.0" rx="8" fill="#F7F4F1"/>
<circle cx="104" cy="379.0" r="17" fill="#2F7466"/>
<text x="104.0" y="385.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="134.0" y="376.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">하늘 보좌</text>
<text x="134.0" y="397.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">「이리로 올라 오라」(4:1) · 네 생물과 이십사 장로</text>
<rect x="76.0" y="410.0" width="714.0" height="50.0" rx="8" fill="#F2EEEA"/>
<circle cx="104" cy="435.0" r="17" fill="#2F7466"/>
<text x="104.0" y="441.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text x="134.0" y="432.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">일곱 인 봉한 책과 어린양</text>
<text x="134.0" y="453.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">「일찍 죽임을 당한 것 같더라」(5:6) — 어린양만 책을 펴신다</text>
<rect x="76.0" y="466.0" width="714.0" height="50.0" rx="8" fill="#F7F4F1"/>
<circle cx="104" cy="491.0" r="17" fill="#C7A15A"/>
<text x="104.0" y="497.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text x="134.0" y="488.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">여섯 인 — 재난의 징조</text>
<text x="134.0" y="509.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">흰 말 · 붉은 말(전쟁) · 검은 말(기근) · 청황색 말(사망) · 순교자 · 큰 지진</text>
<rect x="738.0" y="475.0" width="36.0" height="24.0" rx="12" fill="#C7A15A"/>
<text x="756.0" y="492.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">인</text>
<rect x="76.0" y="522.0" width="714.0" height="50.0" rx="8" fill="#F2EEEA"/>
<circle cx="104" cy="547.0" r="17" fill="#C7A15A"/>
<text x="104.0" y="553.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text>
<text x="134.0" y="544.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">인 맞은 14만 4천 · 흰 옷 입은 큰 무리</text>
<text x="134.0" y="565.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">심판 사이에 보호받는 하나님의 백성</text>
<rect x="724.0" y="531.0" width="50.0" height="24.0" rx="12" fill="#8C7B6E"/>
<text x="749.0" y="548.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">막간</text>
<rect x="76.0" y="578.0" width="714.0" height="50.0" rx="8" fill="#F7F4F1"/>
<circle cx="104" cy="603.0" r="17" fill="#B5532F"/>
<text x="104.0" y="609.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text>
<text x="134.0" y="600.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">일곱째 인 → 네 나팔</text>
<text x="134.0" y="621.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">후 3년 반이 시작된다는 신호 — 땅 · 바다 · 강 · 해의 3분의 1</text>
<rect x="724.0" y="587.0" width="50.0" height="24.0" rx="12" fill="#B5532F"/>
<text x="749.0" y="604.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">나팔</text>
<rect x="76.0" y="634.0" width="714.0" height="50.0" rx="8" fill="#F2EEEA"/>
<circle cx="104" cy="659.0" r="17" fill="#B5532F"/>
<text x="104.0" y="665.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">9</text>
<text x="134.0" y="656.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">다섯째 · 여섯째 나팔</text>
<text x="134.0" y="677.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">무저갱의 황충 · 유브라데의 네 천사</text>
<rect x="724.0" y="643.0" width="50.0" height="24.0" rx="12" fill="#B5532F"/>
<text x="749.0" y="660.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">나팔</text>
<rect x="76.0" y="690.0" width="714.0" height="50.0" rx="8" fill="#F7F4F1"/>
<circle cx="104" cy="715.0" r="17" fill="#B5532F"/>
<text x="104.0" y="721.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">10</text>
<text x="134.0" y="712.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">작은 책</text>
<text x="134.0" y="733.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">「다시 예언하여야 하리라」(10:11)</text>
<rect x="724.0" y="699.0" width="50.0" height="24.0" rx="12" fill="#8C7B6E"/>
<text x="749.0" y="716.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">막간</text>
<rect x="76.0" y="746.0" width="714.0" height="50.0" rx="8" fill="#F2EEEA"/>
<circle cx="104" cy="771.0" r="17" fill="#B5532F"/>
<text x="104.0" y="777.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">11</text>
<text x="134.0" y="768.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">두 증인 · 일곱째 나팔</text>
<text x="134.0" y="789.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">「세상 나라가 우리 주와 그 그리스도의 나라가 되어」(11:15)</text>
<rect x="724.0" y="755.0" width="50.0" height="24.0" rx="12" fill="#B5532F"/>
<text x="749.0" y="772.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">나팔</text>
<rect x="810.0" y="186.0" width="8.0" height="162.0" rx="4" fill="#8C7B6E"/>
<rect x="810.0" y="354.0" width="8.0" height="106.0" rx="4" fill="#64457F"/>
<rect x="810.0" y="466.0" width="8.0" height="162.0" rx="4" fill="#4A3F38"/>
<rect x="810.0" y="634.0" width="8.0" height="50.0" rx="4" fill="#C7A15A"/>
<rect x="810.0" y="690.0" width="8.0" height="106.0" rx="4" fill="#5B6B7F"/>
<rect x="826.0" y="186.0" width="714.0" height="50.0" rx="8" fill="#F2EEEA"/>
<circle cx="854" cy="211.0" r="17" fill="#8C7B6E"/>
<text x="854.0" y="217.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">12</text>
<text x="884.0" y="208.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">여자와 붉은 용</text>
<text x="884.0" y="229.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">용이 하늘에서 쫓겨나다 — 「옛 뱀 곧 마귀」(12:9)</text>
<rect x="1474.0" y="195.0" width="50.0" height="24.0" rx="12" fill="#8C7B6E"/>
<text x="1499.0" y="212.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">막간</text>
<rect x="826.0" y="242.0" width="714.0" height="50.0" rx="8" fill="#F7F4F1"/>
<circle cx="854" cy="267.0" r="17" fill="#8C7B6E"/>
<text x="854.0" y="273.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">13</text>
<text x="884.0" y="264.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">바다 짐승 · 땅 짐승</text>
<text x="884.0" y="285.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">짐승의 표 · 666</text>
<rect x="1474.0" y="251.0" width="50.0" height="24.0" rx="12" fill="#8C7B6E"/>
<text x="1499.0" y="268.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">막간</text>
<rect x="826.0" y="298.0" width="714.0" height="50.0" rx="8" fill="#F2EEEA"/>
<circle cx="854" cy="323.0" r="17" fill="#8C7B6E"/>
<text x="854.0" y="329.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">14</text>
<text x="884.0" y="320.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">어린양과 14만 4천 · 추수</text>
<text x="884.0" y="341.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">영원한 복음 · 「바벨론이 무너졌도다」</text>
<rect x="1474.0" y="307.0" width="50.0" height="24.0" rx="12" fill="#8C7B6E"/>
<text x="1499.0" y="324.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">막간</text>
<rect x="826.0" y="354.0" width="714.0" height="50.0" rx="8" fill="#F7F4F1"/>
<circle cx="854" cy="379.0" r="17" fill="#64457F"/>
<text x="854.0" y="385.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">15</text>
<text x="884.0" y="376.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">일곱 대접을 가진 천사</text>
<text x="884.0" y="397.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">모세의 노래와 어린양의 노래</text>
<rect x="1474.0" y="363.0" width="50.0" height="24.0" rx="12" fill="#64457F"/>
<text x="1499.0" y="380.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">대접</text>
<rect x="826.0" y="410.0" width="714.0" height="50.0" rx="8" fill="#F2EEEA"/>
<circle cx="854" cy="435.0" r="17" fill="#64457F"/>
<text x="854.0" y="441.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">16</text>
<text x="884.0" y="432.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">일곱 대접</text>
<text x="884.0" y="453.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">후 3년 반에 쏟아지는 「마지막 재앙」(15:1) · 아마겟돈 · 「되었다」</text>
<rect x="1474.0" y="419.0" width="50.0" height="24.0" rx="12" fill="#64457F"/>
<text x="1499.0" y="436.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">대접</text>
<rect x="826.0" y="466.0" width="714.0" height="50.0" rx="8" fill="#F7F4F1"/>
<circle cx="854" cy="491.0" r="17" fill="#4A3F38"/>
<text x="854.0" y="497.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">17</text>
<text x="884.0" y="488.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">큰 음녀 바벨론</text>
<text x="884.0" y="509.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">「큰 음녀의 받을 심판을 네게 보이리라」(17:1)</text>
<rect x="1474.0" y="475.0" width="50.0" height="24.0" rx="12" fill="#4A3F38"/>
<text x="1499.0" y="492.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">심판</text>
<rect x="826.0" y="522.0" width="714.0" height="50.0" rx="8" fill="#F2EEEA"/>
<circle cx="854" cy="547.0" r="17" fill="#4A3F38"/>
<text x="854.0" y="553.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">18</text>
<text x="884.0" y="544.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">바벨론의 멸망</text>
<text x="884.0" y="565.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">「무너졌도다 무너졌도다 큰 성 바벨론이여」(18:2)</text>
<rect x="1474.0" y="531.0" width="50.0" height="24.0" rx="12" fill="#4A3F38"/>
<text x="1499.0" y="548.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">심판</text>
<rect x="826.0" y="578.0" width="714.0" height="50.0" rx="8" fill="#F7F4F1"/>
<circle cx="854" cy="603.0" r="17" fill="#4A3F38"/>
<text x="854.0" y="609.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">19</text>
<text x="884.0" y="600.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">재림 — 백마 탄 이</text>
<text x="884.0" y="621.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">「만왕의 왕이요 만주의 주」(19:16) · 짐승과 거짓 선지자가 유황불 못에(19:20)</text>
<rect x="1474.0" y="587.0" width="50.0" height="24.0" rx="12" fill="#2F7466"/>
<text x="1499.0" y="604.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">재림</text>
<rect x="826.0" y="634.0" width="714.0" height="50.0" rx="8" fill="#F2EEEA"/>
<circle cx="854" cy="659.0" r="17" fill="#C7A15A"/>
<text x="854.0" y="665.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">20</text>
<text x="884.0" y="656.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">천년왕국 → 사단의 최후 · 크고 흰 보좌</text>
<text x="884.0" y="677.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">사단 결박 · 「그리스도로 더불어 천년 동안 왕노릇」(20:4–6) → 불과 유황 못(20:10) · 생명책(20:12)</text>
<rect x="1474.0" y="643.0" width="50.0" height="24.0" rx="12" fill="#9A6510"/>
<text x="1499.0" y="660.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">천년</text>
<rect x="826.0" y="690.0" width="714.0" height="50.0" rx="8" fill="#F7F4F1"/>
<circle cx="854" cy="715.0" r="17" fill="#5B6B7F"/>
<text x="854.0" y="721.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">21</text>
<text x="884.0" y="712.0" font-size="17" fill="#2A211B" font-weight="700" text-anchor="start">새 하늘과 새 땅 · 새 예루살렘</text>
<text x="884.0" y="733.0" font-size="12.5" fill="#6B5C52" font-weight="400" text-anchor="start">「하나님의 장막이 사람들과 함께」(21:3) · 눈물도 사망도 없다</text>
<rect x="826.0" y="746.0" width="714.0" height="50.0" rx="8" fill="#F2EEEA"/>
<circle cx="854" cy="771.0" r="17" fill="#5B6B7F"/>
