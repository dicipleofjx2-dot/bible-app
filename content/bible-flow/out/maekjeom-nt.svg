<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR','WenQuanYi Zen Hei',sans-serif">
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60.0" y="64.0" font-size="34" fill="#2A211B" font-weight="700" text-anchor="start">성경맥잡기 1단계 — 신약의 맥점</text>
<text x="60.0" y="98.0" font-size="17" fill="#6B5C52" font-weight="400" text-anchor="start">이 여덟 가지만 붙잡으면 신약 27권의 흐름이 잡힌다</text>
<rect x="60.0" y="130" width="356.5" height="360" rx="16" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="60.0" y="130" width="356.5" height="118" rx="16" fill="#9A6510"/>
<rect x="60.0" y="230" width="356.5" height="18" fill="#9A6510"/>
<circle cx="94.0" cy="166" r="20" fill="#FFFFFF"/>
<text x="94.0" y="173.0" font-size="20" fill="#9A6510" font-weight="700" text-anchor="middle">1</text>
<text x="126.0" y="173.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">성경 전체</text>
<text x="82.0" y="222.0" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start">3 × 9 = 27</text>
<text x="82.0" y="286.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">구약 39권 · 신약 27권 · 합</text>
<text x="82.0" y="313.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">66권 — 구구단으로 외운다</text>
<rect x="434.5" y="130" width="356.5" height="360" rx="16" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="434.5" y="130" width="356.5" height="118" rx="16" fill="#B5532F"/>
<rect x="434.5" y="230" width="356.5" height="18" fill="#B5532F"/>
<circle cx="468.5" cy="166" r="20" fill="#FFFFFF"/>
<text x="468.5" y="173.0" font-size="20" fill="#B5532F" font-weight="700" text-anchor="middle">2</text>
<text x="500.5" y="173.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">성경의 중심</text>
<text x="456.5" y="222.0" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start">약(約) = 약속</text>
<text x="456.5" y="286.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">구약 = 메시야가 오신다 · 신약 =</text>
<text x="456.5" y="313.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">그분이 예수님이시고 다시 오신다 —</text>
<text x="456.5" y="340.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">역사도 BC · AD 로 나뉜다</text>
<rect x="809.0" y="130" width="356.5" height="360" rx="16" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="809.0" y="130" width="356.5" height="118" rx="16" fill="#5B6B7F"/>
<rect x="809.0" y="230" width="356.5" height="18" fill="#5B6B7F"/>
<circle cx="843.0" cy="166" r="20" fill="#FFFFFF"/>
<text x="843.0" y="173.0" font-size="20" fill="#5B6B7F" font-weight="700" text-anchor="middle">3</text>
<text x="875.0" y="173.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">신약의 구조</text>
<text x="831.0" y="222.0" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start">5 · 13 · 9</text>
<text x="831.0" y="286.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">역사서 5(4복음서 + 사도행전) ·</text>
<text x="831.0" y="313.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">바울서신 13(교리 2 · 옥중 4</text>
<text x="831.0" y="340.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">· 목회 3 · 교회 4) ·</text>
<text x="831.0" y="367.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">비바울서신 9</text>
<rect x="1183.5" y="130" width="356.5" height="360" rx="16" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="1183.5" y="130" width="356.5" height="118" rx="16" fill="#2F7466"/>
<rect x="1183.5" y="230" width="356.5" height="18" fill="#2F7466"/>
<circle cx="1217.5" cy="166" r="20" fill="#FFFFFF"/>
<text x="1217.5" y="173.0" font-size="20" fill="#2F7466" font-weight="700" text-anchor="middle">4</text>
<text x="1249.5" y="173.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">복음서</text>
<text x="1205.5" y="222.0" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start">스토리 청크 7</text>
<text x="1205.5" y="286.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">탄생 · 세례 요한 · 갈릴리 사역</text>
<text x="1205.5" y="313.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">· 오병이어 · 수난 예고 ·</text>
<text x="1205.5" y="340.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">예루살렘 사역 · 십자가와 부활</text>
<text x="1205.5" y="367.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">(요한은 절기 중심)</text>
<rect x="60.0" y="510" width="356.5" height="360" rx="16" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="60.0" y="510" width="356.5" height="118" rx="16" fill="#952B38"/>
<rect x="60.0" y="610" width="356.5" height="18" fill="#952B38"/>
<circle cx="94.0" cy="546" r="20" fill="#FFFFFF"/>
<text x="94.0" y="553.0" font-size="20" fill="#952B38" font-weight="700" text-anchor="middle">5</text>
<text x="126.0" y="553.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">사도행전 구조</text>
<text x="82.0" y="602.0" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start">행 1:8</text>
<text x="82.0" y="666.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">예루살렘(1–7장) → 온 유대와</text>
<text x="82.0" y="693.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">사마리아(8–12장) → 땅</text>
<text x="82.0" y="720.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">끝(13–28장)</text>
<rect x="434.5" y="510" width="356.5" height="360" rx="16" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="434.5" y="510" width="356.5" height="118" rx="16" fill="#64457F"/>
<rect x="434.5" y="610" width="356.5" height="18" fill="#64457F"/>
<circle cx="468.5" cy="546" r="20" fill="#FFFFFF"/>
<text x="468.5" y="553.0" font-size="20" fill="#64457F" font-weight="700" text-anchor="middle">6</text>
<text x="500.5" y="553.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">오순절 성령 강림</text>
<text x="456.5" y="602.0" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start">예언의 성취</text>
<text x="456.5" y="666.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">요엘을 비롯한 구약 선지자의 예언 ·</text>
<text x="456.5" y="693.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">세례 요한의 예언(성령과 불) ·</text>
<text x="456.5" y="720.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">예수님의 인용(행 1:5)이 행</text>
<text x="456.5" y="747.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">2장에서 이루어짐</text>
<rect x="809.0" y="510" width="356.5" height="360" rx="16" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="809.0" y="510" width="356.5" height="118" rx="16" fill="#4A3F38"/>
<rect x="809.0" y="610" width="356.5" height="18" fill="#4A3F38"/>
<circle cx="843.0" cy="546" r="20" fill="#FFFFFF"/>
<text x="843.0" y="553.0" font-size="20" fill="#4A3F38" font-weight="700" text-anchor="middle">7</text>
<text x="875.0" y="553.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">바울의 선교여행</text>
<text x="831.0" y="602.0" font-size="26" fill="#FFFFFF" font-weight="700" text-anchor="start">지도로 확인!</text>
<text x="831.0" y="666.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">1 · 2 · 3차 여행과 로마행을</text>
<text x="831.0" y="693.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">지도로 — 오래 머문 곳에서 편지가</text>
<text x="831.0" y="720.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">나왔다(고린도 · 에베소 · 로마)</text>
<rect x="1183.5" y="510" width="356.5" height="360" rx="16" fill="#F7F4F1" stroke="#E3DDD7"/>
<rect x="1183.5" y="510" width="356.5" height="118" rx="16" fill="#C7A15A"/>
<rect x="1183.5" y="610" width="356.5" height="18" fill="#C7A15A"/>
<circle cx="1217.5" cy="546" r="20" fill="#FFFFFF"/>
<text x="1217.5" y="553.0" font-size="20" fill="#C7A15A" font-weight="700" text-anchor="middle">8</text>
<text x="1249.5" y="553.0" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start">요한계시록</text>
<text x="1205.5" y="602.0" font-size="21" fill="#FFFFFF" font-weight="700" text-anchor="start">봉인된 두루마리가 열린다</text>
<text x="1205.5" y="666.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">다니엘이 봉한 두루마리를 예수님이</text>
<text x="1205.5" y="693.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">떼신다 — 7인(징조) →</text>
<text x="1205.5" y="720.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">7나팔(시작) → 7대접(내용) →</text>
<text x="1205.5" y="747.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">재림 · 심판 · 천년왕국 · 백보좌</text>
<text x="1205.5" y="774.0" font-size="16" fill="#2A211B" font-weight="400" text-anchor="start">· 새 하늘과 새 땅</text>
</svg>