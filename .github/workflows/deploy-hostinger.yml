# 데이빗바이블 웹 → 호스팅어 배포.
#
# 빌드는 여기(GitHub)에서 하고, 호스팅어에는 완성된 파일만 올린다. 호스팅어 서버의
# CPU·메모리(여러 사이트가 함께 쓴다)를 빌드에 쓰지 않으려는 것이다.
#
# `main` 에 푸시(= PR 합치기)되면 자동으로 배포한다. 손으로도 돌릴 수 있다(workflow_dispatch).
# 같은 코드를 Vercel 도 `main` 에서 배포한다 — Vercel 을 끌 때까지 두 곳이 함께 갱신된다.
#
# 필요한 Secrets (Settings → Secrets and variables → Actions). 값은 채팅에 적지 말고
# 거기에 직접 넣는다:
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY   (없으면 빌드가 실패한다)
#   HOSTINGER_SSH_HOST, HOSTINGER_SSH_PORT, HOSTINGER_SSH_USER
#   HOSTINGER_SSH_KEY         (배포 전용 개인키 전체, BEGIN/END 줄 포함)
#   Variable(Secret 아님): HOSTINGER_SSH_FINGERPRINT — 호스팅어 SSH 화면의 ED25519 지문(SHA256:…)
#   (예전 HOSTINGER_SSH_KNOWN_HOSTS Secret 은 더 쓰지 않는다 — 지워도 된다.)
#   HOSTINGER_SSH_DIR         (…/davidbible.dgaiworks.com/public_html/ 로 끝나는 절대 경로)
#   (예전 HOSTINGER_FTP_* 는 더 쓰지 않는다 — FTPS 가 데이터 연결에서 끊겼다.)
name: Deploy web to Hostinger

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (expo export)
        run: npx expo export -p web && node scripts/fix-web-head.mjs
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Add .htaccess
        run: cp deploy/hostinger.htaccess dist/.htaccess

      - name: Sanity check dist
        run: |
          test -f dist/index.html
          test -f dist/+not-found.html
          find dist -name '*.wasm' | grep -q .   # SQLite WASM 이 빠지면 앱이 안 열린다
          echo "files: $(find dist -type f | wc -l)"

      # FTPS 는 데이터 연결이 서버에서 끊겨(ECONNRESET) 쓰지 못했다. 암호화된 SSH(rsync)로
      # 올린다. 타사 액션 대신 직접 쓴 것은, 배포 열쇠를 외부 코드에 넘기지 않으려는 것이다.
      # (rsync 는 node_modules 를 따로 빼지 않으므로 assets/node_modules/… 의 SQLite WASM 도
      #  그대로 올라간다 — FTP 배포 액션은 기본값이 이것을 빼 버린다.)
      - name: Upload to Hostinger (rsync over SSH)
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          # 호스팅어 SSH 화면의 「Host key fingerprint (ED25519)」 값(SHA256:…). 공개 정보라
          # Secret 이 아니라 Variable 이다 — 마스킹되지 않아야 틀렸을 때 로그에서 비교할 수 있다.
          EXPECTED_FP: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
          SSH_DIR: ${{ secrets.HOSTINGER_SSH_DIR }}
        run: |
          set -euo pipefail

          # --delete 는 원격 폴더에서 dist 에 없는 파일을 지운다. 경로를 잘못 넣으면
          # 다른 사이트 파일까지 지울 수 있으므로, 이 사이트의 폴더가 아니면 멈춘다.
          case "$SSH_DIR" in
            *davidbible.dgaiworks.com/public_html/) ;;
            *) echo "HOSTINGER_SSH_DIR 이 davidbible.dgaiworks.com/public_html/ 로 끝나야 한다."; exit 1 ;;
          esac

          # Windows 에서 복사해 넣은 값에는 줄 끝 \r(CRLF)이 붙어 오는 일이 흔하다. 서버 지문은
          # 한 글자만 달라도 「이 서버의 키를 모른다」가 되고, 개인키는 형식 오류가 된다.
          # 그래서 \r 을 지운다.
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # 서버 키는 붙여 넣은 값 대신 서버에서 직접 받고, 지문이 호스팅어 화면의 것과
          # 같을 때만 믿는다(Secret 으로 넣은 known_hosts 는 복사 과정에서 형식이 깨졌다).
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > "$HOME/.ssh/known_hosts.scan" 2>/dev/null
          actual="$(ssh-keygen -lf "$HOME/.ssh/known_hosts.scan" | awk '{print $2}')"
          expected="$(printf '%s' "$EXPECTED_FP" | tr -d ' \r\n')"
          echo "서버가 내놓은 ED25519 지문: $actual"
          echo "변수에 적어 둔 지문:       ${expected:-(비어 있음)}"
          if [ -z "$expected" ]; then
            echo "Variable HOSTINGER_SSH_FINGERPRINT 가 없다. 위 '서버가 내놓은 지문'이 호스팅어 화면과 같은지 보고 그 값을 넣는다."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "지문이 다르다 — 서버가 바뀌었거나 값을 잘못 적었다. 멈춘다."
            exit 1
          fi
          mv "$HOME/.ssh/known_hosts.scan" "$HOME/.ssh/known_hosts"

          rsync -rltz --delete --chmod=D755,F644 \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_DIR"

          rm -f "$HOME/.ssh/deploy_key"
