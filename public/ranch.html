<script>
(function(){
var el=document.getElementById('c'),tip=document.getElementById('tip');
var R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;el.appendChild(R.domElement);

var gnd=new THREE.Mesh(new THREE.CircleGeometry(40,48),M(0x4a7d30));gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;S.add(gnd);

var post=M(0x8a6234);

var barn=new THREE.Group();add(barn,box,M(0xa63d2f),0,2,0,6,4,5);add(barn,cone,M(0x5a3a28),0,5,0,4.9,2.4,3.6).rotation.y=Math.PI/4;add(barn,box,M(0xf3ead8),0,1.3,2.52,1.8,2.6,.1);add(barn,box,M(0xf3ead8),0,3.4,2.52,1.1,1.1,.1);barn.position.set(2,0,-15);S.add(barn);
add(S,cyl,M(0xd9b44a),-9,.55,-7,.9,1.1,.9).rotation.z=Math.PI/2;

tree(-15,-9,1.3);tree(-18,2,1.1);tree(14,-7,1.2);tree(17,6,1);tree(-12,13,1.2);tree(9,16,1.3);
var fc=[0xf4c0d1,0xfac775,0xffffff,0xafa9ec];
for(var i=0;i<46;i++){var an=Math.random()*6.28,r=3+Math.random()*8,x=Math.cos(an)*r,z=Math.sin(an)*r;if(Math.hypot(x+5,z+4)<3.6)continue;add(S,cyl,M(0x3b6d11),x,.12,z,.015,.24,.015);add(S,sph,M(fc[i%4]),x,.27,z,.07,.07,.07)}

var BR={

var DIM={sheep:[.62,.5,.8,.38],cow:[.72,.62,1.15,.62],goat:[.42,.42,.62,.5],dog:[.34,.34,.55,.42],cat:[.22,.22,.36,.22]};

function build(key){
var f=BR[key]||BR.merino,t=f.sp,g=new THREE.Group(),D=DIM[t].slice();
if(f.big){D[0]*=1.2;D[1]*=1.2;D[2]*=1.2;D[3]*=1.15}if(f.short)D[3]*=.55;if(f.fluffy){D[0]*=1.2;D[1]*=1.15}

var hr=bw*.5;add(head,sph,M(hc),0,0,hr*.5,hr,hr*.95,hr*1.25);
if(t=='sheep'){var wm=M(f.wool);for(var i=0;i<14;i++){var a=i/14*Math.PI*2;add(body,sph,wm,Math.cos(a)*bw*.7,ly+bh+Math.sin(a)*bh*.55,(i%3-1)*bl*.4,bw*.5,bw*.5,bw*.55)}add(body,sph,wm,0,ly+bh*1.5,bl*.15,bw*.8,bh*.55,bl*.75);add(head,sph,wm,0,hr*.9,0,hr*.8,hr*.5,hr*.7);add(head,sph,M(hc),-hr*1.05,0,hr*.3,hr*.55,hr*.25,hr*.3).rotation.z=.4;add(head,sph,M(hc),hr*1.05,0,hr*.3,hr*.55,hr*.25,hr*.3).rotation.z=-.4;eye(head,-hr*.5,hr*.2,hr*1.3,.04);eye(head,hr*.5,hr*.2,hr*1.3,.04)}

if(t=='goat'){var ec=f.longEars?1.6:1;add(head,cone,M(0x4a3d30),-hr*.5,hr*1.2,-hr*.1,.05,.35,.05).rotation.x=-.5;add(head,cone,M(0x4a3d30),hr*.5,hr*1.2,-hr*.1,.05,.35,.05).rotation.x=-.5;add(head,cone,M(0xe8dcc4),0,-hr*.9,hr*1.1,.05,.2,.05).rotation.x=.2;add(head,sph,M(hc),-hr*1.05,hr*.2-(ec-1)*hr*.3,0,hr*.6*ec,hr*.2,hr*.3).rotation.z=.2;add(head,sph,M(hc),hr*1.05,hr*.2-(ec-1)*hr*.3,0,hr*.6*ec,hr*.2,hr*.3).rotation.z=-.2;eye(head,-hr*.5,hr*.3,hr*1.2,.035);eye(head,hr*.5,hr*.3,hr*1.2,.035)}

var SC={baby:.55,young:.8,adult:1},HS={baby:1.35,young:1.12,adult:1},SP={sheep:.9,cow:.6,goat:1.1,dog:2.2,cat:1.5};
var list=[],herd=new THREE.Group();S.add(herd);
function pick(a){for(var k=0;k<20;k++){var r=Math.sqrt(Math.random())*9.5,an=Math.random()*6.28,x=Math.cos(an)*r,z=Math.sin(an)*r;if(Math.hypot(x+5,z+4)>3.8){a.tx=x;a.tz=z;return}}}
function spawn(item,i){var key=item[0],stage=item[1],a=build(key);a.label=item[2]||'';a.stage=stage;var s=SC[stage]||1;a.s=s;a.g.scale.setScalar(s);a.head.scale.setScalar(HS[stage]||1);var an=i*2.4,r=2+(i%4)*1.6;a.g.position.set(Math.cos(an)*r,0,Math.sin(an)*r);a.sp=SP[a.t]*(stage=='baby'?1.15:1);a.st='g';a.tm=Math.random()*3;a.ph=Math.random()*6;a.g.rotation.y=Math.random()*6;a.g.traverse(function(o){o.userData.ani=a});herd.add(a.g);list.push(a)}

function upd(a,dt){var p=a.g.position,now=performance.now();
if(a.st=='w'){var dx=a.tx-p.x,dz=a.tz-p.z,d=Math.hypot(dx,dz),want=Math.atan2(dx,dz),df=want-a.g.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));a.g.rotation.y+=df*Math.min(1,dt*3);var sp=a.sp*(Math.abs(df)>1?.2:1);p.x+=Math.sin(a.g.rotation.y)*sp*dt;p.z+=Math.cos(a.g.rotation.y)*sp*dt;a.ph+=dt*sp*5.5;var sw=Math.sin(a.ph)*.55;a.legs[0].rotation.x=sw;a.legs[3].rotation.x=sw;a.legs[1].rotation.x=-sw;a.legs[2].rotation.x=-sw;p.y=Math.abs(Math.sin(a.ph))*.03*a.s;a.head.rotation.x+=(-.05-a.head.rotation.x)*dt*4;if(d<.5){a.st='g';a.tm=2+Math.random()*4}}
else{a.legs.forEach(function(l){l.rotation.x*=1-Math.min(1,dt*6)});p.y*=.9;var bob=Math.sin(now/260+a.ph)*.08,tg=(a.t=='cat'||a.t=='dog')?.1+bob*.5:.75+bob;a.head.rotation.x+=(tg-a.head.rotation.x)*dt*3;a.tm-=dt;if(a.tm<=0){pick(a);a.st='w'}}
a.tail.rotation.z=Math.sin(now/(a.t=='dog'?90:400)+a.ph)*(a.t=='dog'?.5:.2)}

var th=.6,ph=.5,drag=false,moved=0,lx=0,ly2=0,dist=24;
function cam(){C.position.set(Math.sin(th)*Math.cos(ph)*dist,Math.sin(ph)*dist,Math.cos(th)*Math.cos(ph)*dist);C.lookAt(0,1.2,0)}
var cv=R.domElement,ray=new THREE.Raycaster(),m2=new THREE.Vector2(),tipT=0;
cv.addEventListener('pointerdown',function(e){drag=true;moved=0;lx=e.clientX;ly2=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-lx,dy=e.clientY-ly2;moved+=Math.abs(dx)+Math.abs(dy);th-=dx*.008;ph=Math.max(.2,Math.min(1.2,ph+dy*.006));lx=e.clientX;ly2=e.clientY});
cv.addEventListener('pointerup',function(e){drag=false;if(moved>6)return;var r=cv.getBoundingClientRect();m2.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(m2,C);var h=ray.intersectObjects(herd.children,true)[0];if(h&&h.object.userData.ani){var a=h.object.userData.ani;tip.textContent=a.label;tip.style.opacity=1;clearTimeout(tipT);tipT=setTimeout(function(){tip.style.opacity=0},2200)}});
var night=new THREE.Color(0x24356b),day=new THREE.Color(0x9fd2f5),dusk=new THREE.Color(0xf0a070),sk=new THREE.Color();
function clock(){var d=new Date(),qh=/[?&]h=([0-9]+)/.exec(location.search),h=qh?+qh[1]:d.getHours()+d.getMinutes()/60,a=(h-6)/24*Math.PI*2,e=Math.sin(a),dl=Math.max(0,Math.min(1,e*2+.25));sun.position.set(Math.cos(a)*22,Math.max(e,.05)*22+2,8);sun.intensity=.35+.5*dl;hemi.intensity=.5+.12*dl;sk.copy(night).lerp(day,dl);if(e>-.1&&e<.25)sk.lerp(dusk,.45*(1-Math.abs(e-.07)/.18));S.background=sk.clone();S.fog=new THREE.Fog(sk.clone(),38,75);document.body.style.background='#'+sk.getHexString()}

window.addEventListener('resize',size);size();clock();setInterval(clock,60000);
function parseHash(){try{var m=/[#&]s=([^&]*)/.exec(location.hash);return m?JSON.parse(decodeURIComponent(m[1])):[]}catch(e){return[]}}
window.addEventListener('message',function(e){var d=e.data;if(d&&d.source==='ranch-host'&&d.items)setState(d.items)});

setState(parseHash());
var last=performance.now();
(function loop(n){var dt=Math.min(.05,(n-last)/1000);last=n;if(!drag)th+=dt*.05;clouds.forEach(function(c,i){c.position.x+=dt*(.6+i*.15);if(c.position.x>50)c.position.x=-50});cam();list.forEach(function(a){upd(a,dt)});R.render(S,C);requestAnimationFrame(loop)})(last);
})();
