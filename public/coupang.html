<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>데이빗바이블쿠팡</title>
  <meta name="theme-color" content="#ff3d54" />
  <link rel="manifest" href="/coupang-manifest.json" />
  <link rel="apple-touch-icon" href="/coupang-icon.png" />
  <link rel="icon" href="/coupang-icon.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #faf6ef;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: #16233d;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px 24px;
      box-sizing: border-box;
      text-align: center;
    }
    img.icon {
      width: 160px;
      height: 160px;
      border-radius: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    p.status {
      font-size: 14px;
      color: #6b6558;
      line-height: 1.6;
      max-width: 320px;
    }
    p.title { font-size: 18px; font-weight: 700; margin: 0 0 10px; }
    p.small { font-size: 13px; margin-top: 14px; }
    a.button {
      display: inline-block;
      background: #ff3d54;
      color: #fff;
      text-decorati  <div class="wrap">
    <img class="icon" src="/coupang-icon.png" alt="데이빗바이블쿠팡" />

    <!-- 홈 화면 아이콘으로 열었을 때만 보이는 문구. 그때는 곧바로 쿠팡으로 넘어간다. -->
    <p class="status" id="going" style="display:none">쿠팡으로 이동하는 중이에요...</p>

    <!-- 앱에서 눌러 들어왔을 때 보이는 안내. 예전에는 이 화면이 뜨자마자 쿠팡으로
         넘어가 버려서, "홈 화면에 추가"를 누를 틈이 없었다. -->
    <div id="howto" style="display:none">
      <p class="title">홈 화면에 추가하기</p>
      <p class="status" id="howto-steps"></p>
      <a class="button" id="go-link" href="#">쿠팡으로 바로가기</a>
      <p class="status small">
        아이콘이 홈 화면에 생기면, 다음부터는 그 아이콘만 눌러도 바로 쿠팡으로 연결됩니다.
      </p>
    </div>

    <p class="status" id="error" style="display:none"></p>
  </div>
  <script>
    (function () {
      var SUPABASE_URL = 'https://bhqbrkeoiyhnmdgvofvy.supabase.co';
      var SUPABASE_ANON_KEY = 'sb_publishable_Bp3WdeLGODDJVCiJ_tzREw_sWJsKH9H';

      // 홈 화면 아이콘으로 연 것인지, 앱에서 눌러 들어온 것인지 가른다.
      //
      // 아이콘으로 열면 브라우저가 standalone으로 띄운다(iOS는 navigator.standalone).
      // 그때는 바로 쿠팡으로 보내는 게 맞다 — 그게 이 아이콘을 만든 이유다.
      // 앱에서 눌러 들어온 경우에는 넘기지 않고 "홈 화면에 추가" 방법을 보여준다.
      var launchedFromIcon =
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        window.navigator.standalone === true ||
        location.search.indexOf('go=1') >= 0;

      var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      document.getElementById('howto-steps').textContent = isIos
        ? '아래 공유 버튼(⬆️)을 누르고 "홈 화면에 추가"를 선택하세요.'
        : '오른쪽 위 메뉴(⋮)를 누르고 "홈 화면에 추가"를 선택하세요.';

      if (launchedFromIcon) {
        document.getElementById('going').style.display = '';
      } else {
        document.getElementById('howto').style.display = '';
      }

      fetch(SUPABASE_URL + '/rest/v1/support_settings?select=coupang_url&id=eq.default', {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        },
      })
        .then(function (res) { return res.json(); })
        .then(function (rows) {
          var url = rows && rows[0] && rows[0].coupang_url;
          if (!url) {
            document.getElementById('going').style.display = 'none';
            document.getElementById('howto').style.display = 'none';
            var empty = document.getElementById('error');
            empty.textContent = '아직 쿠팡파트너스 링크가 준비되지 않았어요.';
            empty.style.display = '';
            return;
          }
          document.getElementById('go-link').href = url;
          if (launchedFromIcon) window.location.replace(url);
        })
        .catch(function () {
          document.getElementById('going').style.display = 'none';
          var box = document.getElementById('error');
          box.textContent = '링크를 불러오지 못했어요. 잠시 후 다시 시도해주세요.';
          box.style.display = '';
        });
    })();
  </script>
    document.getElementById('status').textContent = '링크를 불러오지 못했어요. 잠시 후 다시 시도해주세요.';
        });
    })();
  </script>
</body>
</html>
