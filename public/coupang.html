<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>데이빗바이블쿠팡</title>
  <meta name="theme-color" content="#ff3d54" />
  <link rel="manifest" href="/coupang-manifest.json" />
  <link rel="apple-touch-icon" href="/coupang-icon.png" />
  <link rel="icon" href="/coupang-icon.png" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #faf6ef;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: #16233d;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px 24px;
      box-sizing: border-box;
      text-align: center;
    }
    img.icon {
      width: 160px;
      height: 160px;
      border-radius: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    p.status {
      font-size: 14px;
      color: #6b6558;
      line-height: 1.6;
      max-width: 320px;
    }
    p.title { font-size: 18px; font-weight: 700; margin: 0 0 10px; }
    p.small { font-size: 13px; margin-top: 14px; }
    a.ghost {
      display: inline-block;
      color: #16233d;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 999px;
      border: 1px solid rgba(22,35,61,.18);
      margin-top: 10px;
    }
    a.button {
      display: inline-block;
      background: #ff3d54;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 999px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="icon" src="/coupang-icon.png" alt="데이빗바이블쿠팡" />

    <!-- 홈 화면 아이콘으로 열었을 때만 보이는 문구. 그때는 곧바로 쿠팡으로 넘어간다. -->
    <p class="status" id="going" style="display:none">쿠팡으로 이동하는 중이에요...</p>

    <!-- 앱에서 눌러 들어왔을 때 보이는 안내. 예전에는 이 화면이 뜨자마자 쿠팡으로
         넘어가 버려서, "홈 화면에 추가"를 누를 틈이 없었다. -->
    <div id="howto" style="display:none">
      <p class="title">홈 화면에 추가하기</p>
      <p class="status" id="howto-steps"></p>
      <a class="button" id="install" href="#">+ 홈 화면에 추가하기</a>
      <div id="manual" style="display:none">
        <p class="status small" id="manual-text"></p>
        <a class="ghost" id="open-browser" href="https://davidbible.dgaiworks.com/coupang?howto=1">브라우저에서 열기</a>
        <a class="ghost" id="copy-url" href="#">주소 복사</a>
      </div>
      <a class="ghost" id="go-link" href="#">쿠팡으로 바로가기</a>
      <p class="status small">
        아이콘이 홈 화면에 생기면, 다음부터는 그 아이콘만 눌러도 바로 쿠팡으로 연결됩니다.
      </p>
    </div>

    <p class="status" id="error" style="display:none"></p>
  </div>
  <script>
    (function () {
      var SUPABASE_URL = 'https://bhqbrkeoiyhnmdgvofvy.supabase.co';
      var SUPABASE_ANON_KEY = 'sb_publishable_Bp3WdeLGODDJVCiJ_tzREw_sWJsKH9H';

      // **안내를 보여 달라고 대놓고 부탁한 경우**가 먼저다.
      //
      // 아래 standalone 판정은 "쿠팡 아이콘으로 연 것"을 알아내려는 것인데,
      // 다른 앱(교회앱ON 등)을 홈 화면에 설치해 쓰고 있으면 그 안에서 열린
      // 이 화면도 standalone 이라 **눌러 들어왔는데도 쿠팡으로 튕겼다.**
      // 그래서 ?howto=1 이면 무조건 안내를 보여 준다.
      var forceHowto = location.search.indexOf('howto=1') >= 0;

      // 홈 화면 아이콘으로 연 것인지, 앱에서 눌러 들어온 것인지 가른다.
      //
      // 아이콘으로 열면 브라우저가 standalone으로 띄운다(iOS는 navigator.standalone).
      // 그때는 바로 쿠팡으로 보내는 게 맞다 — 그게 이 아이콘을 만든 이유다.
      // 앱에서 눌러 들어온 경우에는 넘기지 않고 "홈 화면에 추가" 방법을 보여준다.
      var launchedFromIcon = !forceHowto && (
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
        window.navigator.standalone === true ||
        location.search.indexOf('go=1') >= 0);

      // **설치창을 받으려면 이 페이지를 맡은 일꾼에 fetch 처리기가 있어야 한다.**
      // 루트 sw.js 는 알림만 다뤄서 설치창이 아예 안 떴다. /coupang 범위로만 따로 건다.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/coupang-sw.js', { scope: '/coupang' }).catch(function () {});
      }

      var deferredPrompt = null;
      var installBtn = document.getElementById('install');
      var manual = document.getElementById('manual');

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
      });
      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        installBtn.textContent = '홈 화면에 추가했어요';
      });

      // 단추는 **늘 보인다.** 설치창을 줄 수 있으면 그걸 띄우고, 못 주는 기기
      // (아이폰 사파리 등)에서는 손으로 하는 방법을 그 자리에서 보여 준다.
      var PAGE = 'davidbible.dgaiworks.com/coupang?howto=1';

      // 주소를 손으로 치게 하지 않는다 — 눌러서 가거나, 복사해서 붙이거나.
      document.getElementById('copy-url').onclick = function (ev) {
        ev.preventDefault();
        var url = 'https://' + PAGE;
        var done = function () {
          ev.target.textContent = '복사했어요';
          setTimeout(function () { ev.target.textContent = '주소 복사'; }, 2000);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, function () {});
        } else {
          var t = document.createElement('textarea');
          t.value = url;
          document.body.appendChild(t);
          t.select();
          try { document.execCommand('copy'); done(); } catch (e) {}
          document.body.removeChild(t);
        }
      };
      var inApp = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;

      installBtn.onclick = function (ev) {
        ev.preventDefault();

        // 1) 크롬이 설치창을 줄 수 있으면 그걸로 끝낸다.
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt = null;
          return;
        }

        // 2) **다른 앱 안(설치된 교회앱 등)에서 열렸으면 설치창이 아예 안 나온다.**
        //    그 안에는 브라우저 메뉴도 없다. 그러니 브라우저로 넘겨 준다 —
        //    거기서는 설치창이 뜨거나 메뉴로 추가할 수 있다.
        if (isAndroid) {
          window.location.href =
            'intent://' + PAGE + '#Intent;scheme=https;action=android.intent.action.VIEW;end';
          return;
        }

        // 3) 아이폰은 브라우저로 넘기는 길이 없다. 손으로 하는 방법과 **누를 수 있는 링크**를 준다.
        document.getElementById('manual-text').textContent = inApp
          ? '앱 안에서는 추가할 수 없어요. 아래 「브라우저에서 열기」를 누른 뒤, 공유 버튼(⬆️)에서 "홈 화면에 추가"를 선택하세요.'
          : document.getElementById('howto-steps').textContent;
        manual.style.display = '';
        // 같은 문장이 위아래로 두 번 보이지 않게
        document.getElementById('howto-steps').style.display = 'none';
      };

      var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      var isAndroid = /android/i.test(navigator.userAgent);
      document.getElementById('howto-steps').textContent = isIos
        ? '아래 공유 버튼(⬆️)을 누르고 "홈 화면에 추가"를 선택하세요.'
        : '오른쪽 위 메뉴(⋮)를 누르고 "홈 화면에 추가"를 선택하세요.';

      // 앱 안에서 열렸으면 단추가 하는 일이 다르다 — 먼저 브라우저로 넘긴다.
      if (forceHowto && window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
          && /android/i.test(navigator.userAgent)) {
        installBtn.textContent = '브라우저에서 열어 추가하기';
      }

      // 다른 앱 안에서 열려 브라우저 메뉴가 없을 수 있다. 그때 길을 알려 준다.
      if (forceHowto && window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
        document.getElementById('howto-steps').textContent =
          '메뉴가 안 보이면 크롬이나 사파리에서 davidbible.dgaiworks.com/coupang 을 열어 "홈 화면에 추가"를 눌러 주세요.';
      }

      if (launchedFromIcon) {
        document.getElementById('going').style.display = '';
      } else {
        document.getElementById('howto').style.display = '';
      }

      fetch(SUPABASE_URL + '/rest/v1/support_settings?select=coupang_url&id=eq.default', {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        },
      })
        .then(function (res) { return res.json(); })
        .then(function (rows) {
          var url = rows && rows[0] && rows[0].coupang_url;
          if (!url) {
            document.getElementById('going').style.display = 'none';
            document.getElementById('howto').style.display = 'none';
            var empty = document.getElementById('error');
            empty.textContent = '아직 쿠팡파트너스 링크가 준비되지 않았어요.';
            empty.style.display = '';
            return;
          }
          document.getElementById('go-link').href = url;
          if (launchedFromIcon) window.location.replace(url);
        })
        .catch(function () {
          document.getElementById('going').style.display = 'none';
          var box = document.getElementById('error');
          box.textContent = '링크를 불러오지 못했어요. 잠시 후 다시 시도해주세요.';
          box.style.display = '';
        });
    })();
  </script>
</body>
</html>
